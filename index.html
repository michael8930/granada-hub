<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>G HUB PRO</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#071018; color:#e8f2ff; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 22px; }
    .card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 18px; box-shadow: 0 30px 90px rgba(0,0,0,.45); overflow:hidden; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding: 16px 18px; background: linear-gradient(180deg, rgba(0,174,239,.14), rgba(255,255,255,0)); border-bottom: 1px solid rgba(255,255,255,.08); }
    header .title { display:flex; flex-direction:column; gap:4px; }
    header h1 { margin:0; font-size: 18px; letter-spacing:.08em; text-transform: uppercase; }
    header .sub { font-size: 12px; opacity:.75; }
    .btn { appearance:none; border:0; border-radius: 999px; padding: 10px 14px; font-weight: 800; letter-spacing:.06em; text-transform: uppercase; cursor:pointer; }
    .btn.primary { background:#00AEEF; color:#001018; }
    .btn.ghost { background: rgba(255,255,255,.08); color:#e8f2ff; border:1px solid rgba(255,255,255,.12); }
    .btn:disabled { opacity:.55; cursor:not-allowed; }

    .toolbar { display:flex; gap:10px; align-items:center; padding: 12px 18px; border-bottom: 1px solid rgba(255,255,255,.08); flex-wrap:wrap; }
    .toolbar input, .toolbar select {
      background: rgba(0,0,0,.35); color:#e8f2ff; border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px; padding: 10px 12px; outline:none;
    }

    .grid { display:grid; grid-template-columns: 1.2fr .8fr; gap: 14px; padding: 14px; }
    @media (max-width: 980px){ .grid{ grid-template-columns: 1fr; } }

    .panel { background: rgba(0,0,0,.18); border: 1px solid rgba(255,255,255,.08); border-radius: 16px; overflow:hidden; }
    .panel h2 { margin:0; padding: 12px 14px; font-size: 12px; letter-spacing:.18em; text-transform: uppercase; opacity:.8; border-bottom:1px solid rgba(255,255,255,.08); }
    .panel .body { padding: 12px 14px; }

    table { width:100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 10px; border-bottom: 1px solid rgba(255,255,255,.06); text-align:left; vertical-align:top; }
    th { font-size: 11px; opacity:.7; letter-spacing:.14em; text-transform: uppercase; }
    tr:hover td { background: rgba(0,174,239,.06); cursor:pointer; }

    .status { padding: 10px 14px; font-size: 12px; border-top:1px solid rgba(255,255,255,.08); opacity:.85; }
    .status.error { color:#ffb3b3; }
    .status.ok { color:#b6ffcf; }

    form .row { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    form label { font-size: 11px; opacity:.75; letter-spacing:.14em; text-transform: uppercase; display:block; margin: 0 0 6px; }
    form input, form textarea, form select {
      width:100%; box-sizing:border-box;
      background: rgba(0,0,0,.35); color:#e8f2ff;
      border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 10px 12px; outline:none;
    }
    form textarea { min-height: 92px; resize: vertical; }
    .actions { display:flex; gap:10px; align-items:center; margin-top: 10px; flex-wrap:wrap; }

    .note { font-size: 12px; opacity:.75; line-height:1.45; }
    .pill { display:inline-block; padding: 6px 10px; border-radius: 999px; border:1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.06); font-size: 11px; letter-spacing:.08em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <header>
        <div class="title">
          <h1>G HUB PRO</h1>
          <div class="sub">Inventory — loaded from Google Sheets</div>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
          <button id="btnReload" class="btn ghost">Reload</button>
          <button id="btnAdd" class="btn primary">+ Add Product</button>
        </div>
      </header>

      <div class="toolbar">
        <input id="q" type="search" placeholder="Search product name..." />
        <select id="statusFilter">
          <option value="">All Status</option>
        </select>
        <span id="count" class="pill">0 items</span>
      </div>

      <div class="grid">
        <div class="panel">
          <h2>Inventory</h2>
          <div class="body" style="padding:0;">
            <div style="overflow:auto; max-height: 62vh;">
              <table id="tbl">
                <thead>
                  <tr>
                    <th>Product</th>
                    <th>Category/Tab</th>
                    <th>Qty</th>
                    <th>Selling</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
            <div id="loadMsg" class="status">Loading…</div>
          </div>
        </div>

        <div class="panel">
          <h2>Edit / Add</h2>
          <div class="body">
            <form id="frm">
              <div class="row">
                <div>
                  <label>Product Name *</label>
                  <input name="Product Name" required />
                </div>
                <div>
                  <label>Category/Tab *</label>
                  <input name="Category/Tab" required />
                </div>
              </div>

              <div class="row">
                <div>
                  <label>Selling Price XCD</label>
                  <input name="Selling Price XCD" inputmode="decimal" />
                </div>
                <div>
                  <label>Quantity</label>
                  <input name="Quantity" inputmode="numeric" />
                </div>
              </div>

              <div class="row">
                <div>
                  <label>Status</label>
                  <input name="Status" placeholder="In Stock / Sold / Watchlist" />
                </div>
                <div>
                  <label>Image URL</label>
                  <input name="Image URL" />
                </div>
              </div>

              <div>
                <label>Online Link</label>
                <input name="Online Link" />
              </div>

              <div style="margin-top:10px;">
                <label>Note</label>
                <textarea name="Note"></textarea>
              </div>

              <div class="actions">
                <button id="btnSave" type="submit" class="btn primary">Save (Upsert)</button>
                <button id="btnDelete" type="button" class="btn ghost">Delete</button>
                <span id="formMsg" class="note"></span>
              </div>
            </form>
          </div>
          <div class="status note" style="border-top:1px solid rgba(255,255,255,.08);">
            Tip: Click a row on the left to load it into the form.
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  // === CONFIG: your Apps Script Web App URL (JSON API) ===
  const API = "https://script.google.com/macros/s/AKfycbxPuCzoLqRE-xcUuUDx2VTgZnrhPyucuHTjxNJCwU_jeQOXXrJBG6Wq5vvkEHH-JikP/exec";

  const $ = (sel) => document.querySelector(sel);
  const tblBody = $("#tbl tbody");
  const loadMsg = $("#loadMsg");
  const q = $("#q");
  const statusFilter = $("#statusFilter");
  const countEl = $("#count");
  const frm = $("#frm");
  const formMsg = $("#formMsg");
  const btnReload = $("#btnReload");
  const btnAdd = $("#btnAdd");
  const btnDelete = $("#btnDelete");

  let rows = [];
  let selectedKey = null;

  function setLoad(text, type="") {
    loadMsg.textContent = text;
    loadMsg.className = "status" + (type ? " " + type : "");
  }

  function esc(s){ return String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  function keyOf(r){
    return (String(r["Product Name"]||"").trim()+"||"+String(r["Category/Tab"]||"").trim()).toLowerCase();
  }

  function buildStatusOptions() {
    const set = new Set();
    rows.forEach(r => {
      const s = String(r["Status"]||"").trim();
      if (s) set.add(s);
    });
    const cur = statusFilter.value;
    statusFilter.innerHTML = '<option value="">All Status</option>' +
      [...set].sort().map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
    statusFilter.value = cur;
  }

  function applyFilters(list) {
    const needle = q.value.trim().toLowerCase();
    const st = statusFilter.value.trim();
    return list.filter(r => {
      const name = String(r["Product Name"]||"").toLowerCase();
      const okName = !needle || name.includes(needle);
      const okStatus = !st || String(r["Status"]||"").trim() === st;
      return okName && okStatus;
    });
  }

  function render() {
    const filtered = applyFilters(rows);
    countEl.textContent = `${filtered.length} items`;
    tblBody.innerHTML = filtered.map(r => {
      const k = keyOf(r);
      return `<tr data-k="${esc(k)}">
        <td>${esc(r["Product Name"])}</td>
        <td>${esc(r["Category/Tab"])}</td>
        <td>${esc(r["Quantity"] ?? "")}</td>
        <td>${esc(r["Selling Price XCD"] ?? "")}</td>
        <td>${esc(r["Status"] ?? "")}</td>
      </tr>`;
    }).join("");

    tblBody.querySelectorAll("tr").forEach(tr => {
      tr.addEventListener("click", () => {
        const k = tr.getAttribute("data-k");
        const r = rows.find(x => keyOf(x) === k);
        if (r) loadIntoForm(r);
      });
    });
  }

  function clearForm() {
    frm.reset();
    selectedKey = null;
    formMsg.textContent = "";
  }

  function loadIntoForm(r) {
    selectedKey = keyOf(r);
    for (const el of frm.elements) {
      if (!el.name) continue;
      el.value = r[el.name] ?? "";
    }
    formMsg.textContent = "Loaded.";
  }

  async function apiGet() {
    setLoad("Loading…");
    const res = await fetch(API, { method:"GET", cache:"no-store" });
    const data = await res.json();

    if (data && data.ok === false) throw new Error(data.error || "API error");
    if (!Array.isArray(data)) throw new Error("Unexpected response (expected JSON array).");

    rows = data;
    buildStatusOptions();
    render();
    setLoad("Loaded.", "ok");
  }

  async function apiPost(params) {
    const body = new URLSearchParams(params);
    const res = await fetch(API, { method:"POST", body });
    const out = await res.json();
    if (!out || out.ok !== true) throw new Error(out?.error || "Save failed");
    return out;
  }

  frm.addEventListener("submit", async (e) => {
    e.preventDefault();
    formMsg.textContent = "Saving…";
    const params = { _action: "update" };
    for (const el of frm.elements) {
      if (!el.name) continue;
      params[el.name] = el.value;
    }
    if (!params["Product Name"] || !params["Category/Tab"]) {
      formMsg.textContent = "Product Name and Category/Tab are required.";
      return;
    }
    try {
      const out = await apiPost(params);
      formMsg.textContent = out.action === "created" ? "Created." : "Updated.";
      await apiGet();
      // reselect
      const k = (String(params["Product Name"]).trim()+"||"+String(params["Category/Tab"]).trim()).toLowerCase();
      const r = rows.find(x => keyOf(x) === k);
      if (r) loadIntoForm(r);
    } catch (err) {
      formMsg.textContent = "Save failed: " + err.message;
    }
  });

  btnDelete.addEventListener("click", async () => {
    const name = frm.elements["Product Name"]?.value?.trim();
    const tab = frm.elements["Category/Tab"]?.value?.trim();
    if (!name || !tab) { formMsg.textContent = "Product Name and Category/Tab are required to delete."; return; }
    if (!confirm(`Delete "${name}" (${tab}) from the sheet?`)) return;

    formMsg.textContent = "Deleting…";
    try {
      const out = await apiPost({ _action:"delete", "Product Name": name, "Category/Tab": tab });
      formMsg.textContent = out.action === "deleted" ? "Deleted." : "Not found.";
      clearForm();
      await apiGet();
    } catch (err) {
      formMsg.textContent = "Delete failed: " + err.message;
    }
  });

  btnReload.addEventListener("click", apiGet);
  btnAdd.addEventListener("click", clearForm);
  q.addEventListener("input", render);
  statusFilter.addEventListener("change", render);

  // Boot
  apiGet().catch(err => setLoad("Load failed: " + err.message, "error"));
</script>
</body>
</html>
