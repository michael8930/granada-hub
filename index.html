<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Granada Hub Pro | Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.0.0",
        "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
        "@google/genai": "https://esm.sh/@google/genai@1.34.0"
      }
    }
    </script>
    <style>
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { margin: 0; background: #0a0a0c; color: #ffffff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        /* Animations */
        @keyframes thumbsUp { 
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            50% { transform: scale(1.5) rotate(0deg); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
        @keyframes moneyFly {
            0% { transform: translateY(0) rotate(0); opacity: 0; }
            50% { transform: translateY(-100px) rotate(20deg); opacity: 1; }
            100% { transform: translateY(-200px) rotate(-20deg); opacity: 0; }
        }
        .anim-layer { position: fixed; inset: 0; pointer-events: none; z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .thumb-icon { font-size: 80px; color: #00ff88; animation: thumbsUp 1.2s ease-out forwards; }
        .money-icon { font-size: 80px; color: #ffaa00; animation: moneyFly 1.5s ease-in forwards; }

        #boot-screen { position: fixed; inset: 0; background: #0a0a0c; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .spinner { width: 32px; height: 32px; border: 2px solid rgba(0,242,255,0.1); border-top-color: #00f2ff; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .total-bubble { background: #00ff88; color: #000; padding: 4px 10px; border-radius: 20px; font-family: 'Orbitron'; font-size: 10px; font-weight: 900; }
        
        .variant-tag { background: #1a1a1c; border: 1px solid #333; padding: 6px 10px; border-radius: 8px; font-size: 10px; display: flex; align-items: center; gap: 8px; }
        
        .nav-btn { background: #111; border: 1px solid #222; color: #888; padding: 12px; border-radius: 12px; flex: 1; text-align: center; font-size: 9px; font-family: 'Orbitron'; text-decoration: none; }
        
        input, select, textarea { background: #111; border: 1px solid #1a1a1c; color: #fff; border-radius: 10px; padding: 12px; outline: none; }
        input:focus { border-color: #00f2ff; }
        
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="boot-screen">
        <div class="spinner"></div>
        <p style="margin-top:20px; font-family:'Orbitron'; font-size:9px; color:#00f2ff; letter-spacing:4px;">UPLINKING...</p>
    </div>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { GoogleGenAI } from "@google/genai";

        const API_URL = 'https://script.google.com/macros/s/AKfycbxPuCzoLqRE-xcUuUDx2VTgZnrhPyucuHTjxNJCwU_jeQOXXrJBG6Wq5vvkEHH-JikP/exec';
        const EC_RATE = 2.7169;

        const App = () => {
            const [items, setItems] = useState([]);
            const [tabs, setTabs] = useState(["May Shipment", "April Shipment", "Watchlist"]);
            const [activeTab, setActiveTab] = useState("ALL");
            const [modal, setModal] = useState(null);
            const [animation, setAnimation] = useState(null);
            const [cur, setCur] = useState("USD");
            const [syncing, setSyncing] = useState(false);

            useEffect(() => { loadData(); }, []);

            const loadData = async () => {
                setSyncing(true);
                try {
                    const r = await fetch(`${API_URL}?cache=${Date.now()}`);
                    const d = await r.json();
                    setItems(d.map(x => ({
                        ...x,
                        variants: x.variants ? JSON.parse(x.variants) : []
                    })));
                } finally { 
                    setSyncing(false); 
                    document.getElementById('boot-screen').style.display = 'none';
                }
            };

            const triggerAnim = (status) => {
                if (status === 'Purchased') setAnimation('thumb');
                if (status === 'Shipped') setAnimation('money');
                setTimeout(() => setAnimation(null), 1600);
            };

            const handleSave = async (f) => {
                triggerAnim(f.status);
                // POST Logic to Sheets...
                setModal(null);
                loadData();
            };

            return (
                <div style={{ maxWidth: 500, margin: '0 auto', background: '#0a0a0c', minHeight: '100vh' }}>
                    {animation === 'thumb' && <div className="anim-layer"><i className="fas fa-thumbs-up thumb-icon"></i></div>}
                    {animation === 'money' && <div className="anim-layer"><i className="fas fa-money-bill-wave money-icon"></i></div>}

                    {/* Header */}
                    <header style={{ padding: 20, borderBottom: '1px solid #1a1a1c', sticky: 'top', background: '#0a0a0c' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
                            <h1 style={{ fontFamily: 'Orbitron', fontSize: 18, margin: 0 }}>G-HUB PRO</h1>
                            <div style={{ display: 'flex', gap: 10 }}>
                                <a href="https://grenada-dashboard-mobile.vercel.app" className="nav-btn"><i className="fas fa-chart-line"></i></a>
                                <a href="https://grenada-trip-helper.vercel.app" className="nav-btn"><i className="fas fa-map-marked-alt"></i></a>
                            </div>
                        </div>

                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                            <div style={{ background: '#111', padding: 15, borderRadius: 12 }}>
                                <span style={{ fontSize: 8, color: '#444', fontFamily: 'Orbitron' }}>TOTAL VALUE</span>
                                <div style={{ fontSize: 18, fontWeight: 700, color: '#00ff88' }}>
                                    <span className="total-bubble">$4,250</span>
                                </div>
                            </div>
                            <button onClick={() => setModal({ name: '', variants: [], status: 'Assigned' })} style={{ background: '#00f2ff', color: '#000', border: 'none', borderRadius: 12, fontFamily: 'Orbitron', fontWeight: 900 }}>+ ADD NEW</button>
                        </div>
                    </header>

                    {/* List */}
                    <main style={{ padding: 15 }}>
                        {items.map((item, idx) => (
                            <div key={idx} onClick={() => setModal(item)} style={{ background: '#111', padding: 15, borderRadius: 16, marginBottom: 12, border: '1px solid #1a1a1c' }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                                    <span style={{ fontSize: 10, color: '#00f2ff', fontFamily: 'Orbitron' }}>{item.status}</span>
                                    <span className="total-bubble">COST: ${item.costUSD}</span>
                                </div>
                                <h3 style={{ margin: '10px 0' }}>{item.name}</h3>
                                <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap' }}>
                                    {item.variants?.map((v, i) => (
                                        <div key={i} className="variant-tag">{v.size} / {v.color}</div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </main>

                    {modal && <FormModal item={modal} onClose={() => setModal(null)} onSave={handleSave} />}
                </div>
            );
        };

        const FormModal = ({ item, onClose, onSave }) => {
            const [f, setF] = useState({ ...item, variants: item.variants || [] });
            
            // Handles cursor placement at start for easier decimal typing
            const handleFocus = (e) => {
                const val = e.target.value;
                e.target.setSelectionRange(0, 0);
            };

            const addVariant = () => {
                setF({...f, variants: [...f.variants, { size: '', color: '', qty: 1 }]});
            };

            return (
                <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.95)', zIindex: 2000, padding: 20, overflowY: 'auto' }}>
                    <div style={{ maxWidth: 400, margin: '0 auto' }}>
                        <h2 style={{ fontFamily: 'Orbitron', fontSize: 14, color: '#00f2ff' }}>PRODUCT CONFIG</h2>
                        
                        <label style={{ fontSize: 9, fontFamily: 'Orbitron', color: '#444' }}>NAME</label>
                        <input style={{ width: '100%', marginBottom: 15 }} value={f.name} onChange={e => setF({...f, name: e.target.value})} />

                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
                            <span style={{ fontSize: 9, fontFamily: 'Orbitron' }}>VARIANTS (SIZES/COLORS)</span>
                            <button onClick={addVariant} style={{ background: '#00f2ff', border: 'none', borderRadius: 5, padding: '5px 10px', fontSize: 10 }}>+ ADD</button>
                        </div>

                        {f.variants.map((v, i) => (
                            <div key={i} style={{ display: 'flex', gap: 5, marginBottom: 5 }}>
                                <input placeholder="Size" style={{ flex: 1 }} value={v.size} onChange={e => {
                                    let nv = [...f.variants]; nv[i].size = e.target.value; setF({...f, variants: nv});
                                }} />
                                <input placeholder="Color" style={{ flex: 1 }} value={v.color} onChange={e => {
                                    let nv = [...f.variants]; nv[i].color = e.target.value; setF({...f, variants: nv});
                                }} />
                                <input type="number" placeholder="Qty" style={{ width: 60 }} value={v.qty} onChange={e => {
                                    let nv = [...f.variants]; nv[i].qty = e.target.value; setF({...f, variants: nv});
                                }} />
                            </div>
                        ))}

                        <div style={{ marginTop: 20 }}>
                            <label style={{ fontSize: 9, fontFamily: 'Orbitron', color: '#444' }}>COST (USD)</label>
                            <input 
                                type="number" 
                                style={{ width: '100%', fontSize: 24, fontFamily: 'Orbitron', color: '#00ff88' }} 
                                value={f.cost} 
                                onFocus={handleFocus}
                                onChange={e => setF({...f, cost: e.target.value})} 
                            />
                        </div>

                        <div style={{ display: 'flex', gap: 10, marginTop: 30 }}>
                            <button onClick={onClose} style={{ flex: 1, padding: 15, background: '#1a1a1c', border: 'none', color: '#fff', borderRadius: 12 }}>CANCEL</button>
                            <button onClick={() => onSave(f)} style={{ flex: 2, padding: 15, background: '#00f2ff', border: 'none', color: '#000', borderRadius: 12, fontWeight: 900 }}>UPLINK HUB</button>
                        </div>
                    </div>
                </div>
            );
        };

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
