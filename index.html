<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <title>Granada Hub Pro | Control</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.0.0",
      "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
      "@google/genai": "https://esm.sh/@google/genai@1.34.0"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    body { margin: 0; background: #0a0a0c; color: #ffffff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
    #boot-screen {
      position: fixed; inset: 0; background: #0a0a0c;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 0.4s ease;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 32px; height: 32px; border: 2px solid rgba(0,242,255,0.1); border-top-color: #00f2ff; border-radius: 50%; animation: spin 0.6s linear infinite; }

    ::-webkit-scrollbar { display: none; }

    input, select, textarea {
      -webkit-appearance: none;
      border-radius: 10px;
      border: 1px solid #1a1a1c;
      outline: none;
      transition: border-color 0.2s;
      background: #111;
      color: #fff;
    }
    input:focus, textarea:focus, select:focus { border-color: #00f2ff !important; }

    .tab-active { border-color: #00f2ff !important; color: #00f2ff !important; background: rgba(0,242,255,0.03) !important; }
    .all-active { border-color: #00ff88 !important; color: #00ff88 !important; background: rgba(0,255,136,0.03) !important; }

    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    .live-indicator { width: 6px; height: 6px; background: #00f2ff; border-radius: 50%; display: inline-block; margin-right: 6px; animation: pulse 1.5s infinite; }

    /* status pills */
    .status-purchased { background: rgba(0,255,136,0.05) !important; color: #00ff88 !important; border: 1px solid rgba(0,255,136,0.2) !important; }
    .status-assigned  { background: rgba(0,242,255,0.05) !important; color: #00f2ff !important; border: 1px solid rgba(0,242,255,0.2) !important; }
    .status-shipped   { background: rgba(255,170,0,0.05) !important; color: #ffaa00 !important; border: 1px solid rgba(255,170,0,0.2) !important; }
    .status-received  { background: rgba(170,0,255,0.05) !important; color: #aa00ff !important; border: 1px solid rgba(170,0,255,0.2) !important; }

    /* markup control */
    .markup-control {
      display: flex; align-items: center; background: #111; border: 1px solid #222; border-radius: 8px; padding: 2px 8px; gap: 6px;
    }
    .markup-select {
      background: transparent; border: none; color: #00f2ff; font-family: 'Orbitron'; font-size: 9px; padding: 8px 4px; cursor: pointer; outline: none;
    }
    .markup-input {
      width: 48px; background: #000; border: 1px solid #222; color: #00f2ff; font-size: 10px; padding: 4px; text-align: center; font-family: 'Orbitron';
    }

    /* tiny “total cost bubble” */
    .cost-bubble {
      position: absolute;
      bottom: 6px;
      left: 6px;
      background: rgba(0,255,136,0.12);
      border: 1px solid rgba(0,255,136,0.25);
      color: #00ff88;
      font-size: 8px;
      font-family: 'Orbitron';
      font-weight: 900;
      padding: 3px 6px;
      border-radius: 8px;
      letter-spacing: 1px;
      z-index: 6;
    }

    /* status change animations */
    @keyframes pop {
      0% { transform: translateY(10px) scale(0.6); opacity: 0; }
      25% { opacity: 1; }
      60% { transform: translateY(-10px) scale(1.0); opacity: 1; }
      100% { transform: translateY(-24px) scale(1.05); opacity: 0; }
    }
    .status-fx {
      position: fixed;
      left: 50%;
      top: 18%;
      transform: translateX(-50%);
      z-index: 99999;
      pointer-events: none;
      font-family: 'Orbitron';
      font-weight: 900;
      letter-spacing: 2px;
      animation: pop 1.1s ease-out forwards;
      text-shadow: 0 0 30px rgba(0,242,255,0.2);
    }
    .fx-purchased { color: #00ff88; }
    .fx-shipped { color: #ffaa00; }
  </style>
</head>

<body>
  <div id="boot-screen">
    <div class="spinner"></div>
    <p style="margin-top:20px;font-family:'Orbitron',sans-serif;font-size:9px;color:#00f2ff;letter-spacing:4px;font-weight:700;">SECURE UPLINK ESTABLISHED</p>
  </div>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useEffect, useMemo, useRef, useState } from "react";
    import { createRoot } from "react-dom/client";
    import { GoogleGenAI } from "@google/genai";

    /* ====== CONFIG ====== */
    const API_URL = "https://script.google.com/macros/s/AKfycbxPuCzoLqRE-xcUuUDx2VTgZnrhPyucuHTjxNJCwU_jeQOXXrJBG6Wq5vvkEHH-JikP/exec";
    const HUB_LOGO = "https://vinylpressusa.com/wp-content/uploads/2025/12/38D06428-7D3B-44EF-B4A9-472C4EDDEB9F.png";

    const EC_RATE = 2.7169;
    const IMG_SEP = "|||";
    const DEFAULT_DELIVERY_TABS = ["May Shipment","April Shipment","Watchlist","Amazon Order"];

    const PRODUCT_TYPES = ["Apparel","Footwear","Food","Cleaning products","Used items","Electronics","Luxury","Misc"];
    const GENDERS = ["Men's","Women's","Children's","Unisex"];
    const APPAREL_SIZES = ["XS","S","M","L","XL","2XL","3XL","4XL","5XL","Kids 2T","Kids 3T","Kids 4T","Kids 5","Kids 6","Kids 7","Kids 8","Kids 10","Kids 12","Kids 14","Kids 16","One Size"];
    const SHOE_SIZES = ["2","2.5","3","3.5","4","4.5","5","5.5","6","6.5","7","7.5","8","8.5","9","9.5","10","10.5","11","11.5","12","12.5","13","13.5","14","14.5"];
    const COLORS = ["Black","White","Gray","Navy","Red","Blue","Green","Yellow","Orange","Purple","Pink","Brown","Tan","Multi"];

    /* ====== VARIANTS STORAGE (backward compatible) ======
       We store variants inside Note field using a tagged JSON payload:
         "__VARIANTS__:{...json...}\n\n<user note here>"
       This avoids requiring an Apps Script / Sheet schema change.
    */
    const VAR_TAG = "__VARIANTS__:";

    function parseNoteAndVariants(noteRaw) {
      const note = (noteRaw || "").toString();
      if (!note.includes(VAR_TAG)) return { noteText: note, variants: null };
      const idx = note.indexOf(VAR_TAG);
      const after = note.slice(idx + VAR_TAG.length);
      const firstLine = after.split("\n")[0].trim();
      try {
        const variants = JSON.parse(firstLine);
        const cleanedNote = (note.slice(0, idx) + after.slice(firstLine.length)).replace(/^\s+|\s+$/g,"");
        return { noteText: cleanedNote.replace(/^\n+/, "").trim(), variants };
      } catch {
        return { noteText: note, variants: null };
      }
    }

    function buildNoteWithVariants(noteText, variants) {
      const n = (noteText || "").toString().trim();
      if (!variants || !Array.isArray(variants) || variants.length === 0) return n;
      const packed = VAR_TAG + JSON.stringify(variants);
      return n ? (packed + "\n\n" + n) : packed;
    }

    function money(n) {
      const v = Number(n || 0);
      if (!Number.isFinite(v)) return 0;
      return v;
    }

    function clampInt(n, fallback=1) {
      const v = parseInt(n, 10);
      return Number.isFinite(v) && v > 0 ? v : fallback;
    }

    function deriveTotals(item) {
      // If variants exist, totals come from variants. Otherwise old single fields.
      const v = Array.isArray(item.variants) && item.variants.length ? item.variants : null;
      const totalQty = v
        ? v.reduce((a,x)=> a + clampInt(x.qty, 1), 0)
        : clampInt(item.qty, 1);

      const totalCostUSD = v
        ? v.reduce((a,x)=> a + (money(x.costUSD) * clampInt(x.qty,1)), 0)
        : (money(item.cost) * clampInt(item.qty,1));

      const totalSellXCD = v
        ? v.reduce((a,x)=> a + (money(x.sellXCD) * clampInt(x.qty,1)), 0)
        : (money(item.sell) * clampInt(item.qty,1));

      return { totalQty, totalCostUSD, totalSellXCD };
    }

    function focusCursorStart(e) {
      // Requirement: cursor at start for decimal input. Do NOT zero the field.
      // Put caret at start and select nothing (so typing inserts at beginning).
      const el = e.target;
      try {
        requestAnimationFrame(() => {
          el.setSelectionRange(0, 0);
        });
      } catch {}
    }

    /* ====== UI: Comms & Lightbox ====== */
    const CommsHub = ({ onClose }) => (
      <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.8)", backdropFilter:"blur(10px)", zIndex:2000, display:"flex", alignItems:"center", justifyContent:"center" }} onClick={onClose}>
        <div style={{ background:"#0a0a0c", border:"1px solid #1a1a1c", padding:30, borderRadius:24, width:"90%", maxWidth:350 }} onClick={e=>e.stopPropagation()}>
          <h2 style={{ fontFamily:"Orbitron", fontSize:14, color:"#00f2ff", textAlign:"center", marginBottom:25, letterSpacing:2 }}>COMMS UPLINK</h2>
          <div style={{ display:"flex", flexDirection:"column", gap:15 }}>
            <a href="tel:+14734150000" style={{ textDecoration:"none", background:"#111", border:"1px solid #222", borderRadius:15, padding:20, display:"flex", alignItems:"center", gap:15 }}>
              <div style={{ width:40, height:40, borderRadius:"50%", background:"rgba(0,242,255,0.1)", display:"flex", alignItems:"center", justifyContent:"center", color:"#00f2ff" }}>
                <i className="fas fa-phone"></i>
              </div>
              <span style={{ fontFamily:"Orbitron", fontSize:11, color:"#fff" }}>CALL MICHAEL</span>
            </a>
            <a href="tel:+14734150001" style={{ textDecoration:"none", background:"#111", border:"1px solid #222", borderRadius:15, padding:20, display:"flex", alignItems:"center", gap:15 }}>
              <div style={{ width:40, height:40, borderRadius:"50%", background:"rgba(255,170,0,0.1)", display:"flex", alignItems:"center", justifyContent:"center", color:"#ffaa00" }}>
                <i className="fas fa-phone"></i>
              </div>
              <span style={{ fontFamily:"Orbitron", fontSize:11, color:"#fff" }}>CALL QUINCY</span>
            </a>
          </div>
          <button onClick={onClose} style={{ marginTop:25, width:"100%", background:"transparent", border:"1px solid #1a1a1c", padding:12, borderRadius:10, color:"#444", fontFamily:"Orbitron", fontSize:9 }}>CLOSE TERMINAL</button>
        </div>
      </div>
    );

    const GalleryLightbox = ({ images, initialIndex, onClose }) => {
      const [index, setIndex] = useState(initialIndex || 0);
      return (
        <div style={{ position:"fixed", inset:0, background:"#000", zIndex:3000, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center" }} onClick={onClose}>
          <button onClick={onClose} style={{ position:"absolute", top:30, right:30, background:"transparent", border:"none", color:"#fff", fontSize:30, cursor:"pointer", zIndex:3001 }}>&times;</button>
          <div style={{ width:"100%", height:"70vh", display:"flex", alignItems:"center", justifyContent:"center", position:"relative" }} onClick={e=>e.stopPropagation()}>
            {images.length>1 && (
              <button onClick={()=>setIndex((index-1+images.length)%images.length)} style={{ position:"absolute", left:20, background:"rgba(0,0,0,0.5)", border:"none", color:"#fff", width:50, height:50, borderRadius:"50%" }}>
                <i className="fas fa-chevron-left"></i>
              </button>
            )}
            <img src={images[index]} style={{ maxWidth:"90%", maxHeight:"90%", objectFit:"contain", border:"2px solid #1a1a1c", borderRadius:8 }} />
            {images.length>1 && (
              <button onClick={()=>setIndex((index+1)%images.length)} style={{ position:"absolute", right:20, background:"rgba(0,0,0,0.5)", border:"none", color:"#fff", width:50, height:50, borderRadius:"50%" }}>
                <i className="fas fa-chevron-right"></i>
              </button>
            )}
          </div>
          <div style={{ marginTop:30, display:"flex", gap:10 }}>
            {images.map((_, i)=> <div key={i} style={{ width:8, height:8, borderRadius:"50%", background:i===index ? "#00f2ff" : "#222" }} />)}
          </div>
          <div style={{ marginTop:20, fontFamily:"Orbitron", fontSize:10, color:"#444", letterSpacing:2 }}>FRAME {index+1} / {images.length}</div>
        </div>
      );
    };

    /* ====== Status FX ====== */
    const StatusFX = ({ kind, text }) => {
      if (!kind) return null;
      const cls = kind === "Purchased" ? "fx-purchased" : "fx-shipped";
      const icon = kind === "Purchased" ? "👍" : "💸";
      return (
        <div className={"status-fx " + cls}>
          <div style={{ fontSize: 44, textAlign:"center", marginBottom: 8 }}>{icon}</div>
          <div style={{ fontSize: 12, textAlign:"center" }}>{text}</div>
        </div>
      );
    };

    /* ====== Form with Variants + AI Camera + Cursor Fix ====== */
    const Form = ({ item, tabs, activeMarkup, onClose, onSave, onDelete, onStatusFX }) => {
      const isVariantCapable = (item.type === "Apparel" || item.type === "Footwear");

      // Base (non-variant) fields preserved for backward compat.
      const [f, setF] = useState(() => ({
        ...item,
        cost: Number(item.cost || 0).toFixed(2),
        sell: Number(item.sell || 0).toFixed(2),
        qty: clampInt(item.qty || 1),
        link: item.link || "",
        note: item.note || "",
        status: item.status || "Assigned",
        img: Array.isArray(item.img) ? item.img : [],
        variants: Array.isArray(item.variants) ? item.variants : []
      }));

      const [scanning, setScanning] = useState(false);
      const [curMode, setCurMode] = useState("XCD");
      const [aiKey, setAiKey] = useState(localStorage.getItem("GHUB_GEMINI_KEY") || "");

      // Variants helpers
      const defaultVariant = () => ({
        gender: f.gender || "Unisex",
        color: "Black",
        size: f.type === "Footwear" ? "" : (f.size || ""),
        shoeSize: f.type === "Footwear" ? (f.shoeSize || "") : "",
        qty: 1,
        costUSD: Number(f.cost || 0),
        sellXCD: Number(f.sell || 0)
      });

      const ensureVariantSeed = () => {
        if (!isVariantCapable) return;
        if (f.variants && f.variants.length) return;
        // seed from current single fields
        const multiplier = 1 + (activeMarkup / 100);
        const costUSD = money(f.cost);
        const sellXCD = money(f.sell) || (costUSD * EC_RATE * multiplier);
        setF(p => ({ ...p, variants: [{ ...defaultVariant(), costUSD, sellXCD }] }));
      };

      useEffect(() => { ensureVariantSeed(); }, [f.type]); // eslint-disable-line

      const variantTotals = useMemo(() => {
        if (!isVariantCapable || !f.variants?.length) {
          const totalQty = clampInt(f.qty, 1);
          const totalCostUSD = money(f.cost) * totalQty;
          const totalSellXCD = money(f.sell) * totalQty;
          return { totalQty, totalCostUSD, totalSellXCD };
        }
        const totalQty = f.variants.reduce((a,x)=> a + clampInt(x.qty,1), 0);
        const totalCostUSD = f.variants.reduce((a,x)=> a + (money(x.costUSD) * clampInt(x.qty,1)), 0);
        const totalSellXCD = f.variants.reduce((a,x)=> a + (money(x.sellXCD) * clampInt(x.qty,1)), 0);
        return { totalQty, totalCostUSD, totalSellXCD };
      }, [f.variants, f.qty, f.cost, f.sell, isVariantCapable]);

      const updateVariantCost = (idx, val) => {
        const numeric = money(val);
        const multiplier = 1 + (activeMarkup / 100);
        const calculatedSell = (numeric * EC_RATE * multiplier);
        setF(prev => {
          const v = [...(prev.variants || [])];
          v[idx] = { ...v[idx], costUSD: numeric, sellXCD: calculatedSell };
          return { ...prev, variants: v };
        });
      };

      const updateSingleCost = (val) => {
        const numeric = money(val);
        const multiplier = 1 + (activeMarkup / 100);
        const calculatedSell = (numeric * EC_RATE * multiplier).toFixed(2);
        setF(prev => ({ ...prev, cost: String(val), sell: calculatedSell }));
      };

      const snapAI = (file) => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      const aiRecognize = async (dataUrl) => {
        // In-browser only: you must provide a key (stored in localStorage).
        // process.env.API_KEY does not exist in static HTML on GitHub Pages / WordPress widgets.
        if (!aiKey) throw new Error("Missing API key");
        const ai = new GoogleGenAI({ apiKey: aiKey });

        const res = await ai.models.generateContent({
          model: "gemini-3-flash-preview",
          contents: {
            parts: [
              { text: "Output JSON only: {name, costUSD, type, size, shoeSize, gender, color, url}." },
              { inlineData: { data: dataUrl.split(",")[1], mimeType: "image/jpeg" } }
            ]
          },
          config: { responseMimeType: "application/json" }
        });

        const txt = (res && (res.text || res.response?.text)) ? (res.text || res.response?.text) : "";
        return JSON.parse(txt || "{}");
      };

      const onSnap = async (e, useAI=false) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setScanning(true);
        try {
          const dataUrl = await snapAI(file);
          if (!useAI) {
            setF(p => ({ ...p, img: [...(p.img || []), dataUrl] }));
            setScanning(false);
            return;
          }

          let d = {};
          try { d = await aiRecognize(dataUrl); } catch { d = {}; }

          // apply recognized fields (best effort, never overwrites with blanks)
          setF(p => {
            const next = { ...p, img: [...(p.img || []), dataUrl] };
            if (d.name) next.name = d.name;
            if (d.type && PRODUCT_TYPES.includes(d.type)) next.type = d.type;
            if (d.gender && GENDERS.includes(d.gender)) next.gender = d.gender;
            if (d.color) next.color = d.color; // used for variants only
            if (d.url) next.link = d.url;
            if (d.size) next.size = d.size;
            if (d.shoeSize) next.shoeSize = d.shoeSize;

            // cost flows to variant or single
            const multiplier = 1 + (activeMarkup / 100);
            if (d.costUSD != null && d.costUSD !== "") {
              const costUSD = money(d.costUSD);
              const sellXCD = costUSD * EC_RATE * multiplier;

              if ((next.type === "Apparel" || next.type === "Footwear")) {
                const v = Array.isArray(next.variants) ? [...next.variants] : [];
                if (v.length === 0) {
                  v.push({
                    gender: next.gender || "Unisex",
                    color: (d.color || "Black"),
                    size: next.type === "Footwear" ? "" : (d.size || next.size || ""),
                    shoeSize: next.type === "Footwear" ? (d.shoeSize || next.shoeSize || "") : "",
                    qty: 1,
                    costUSD,
                    sellXCD
                  });
                } else {
                  v[0] = { ...v[0], costUSD, sellXCD };
                }
                next.variants = v;
              } else {
                next.cost = costUSD.toFixed(2);
                next.sell = sellXCD.toFixed(2);
              }
            }
            return next;
          });
        } finally {
          setScanning(false);
          e.target.value = "";
        }
      };

      const styles = {
        overlay: { position:"fixed", inset:0, background:"rgba(0,0,0,0.92)", zIndex:1000, display:"flex", alignItems:"center", justifyContent:"center", padding:15, backdropFilter:"blur(10px)" },
        modal: { background:"#0a0a0c", border:"1px solid #1a1a1c", borderRadius:24, width:"100%", maxWidth:500, padding:25, maxHeight:"95vh", overflowY:"auto", boxShadow:"0 0 50px rgba(0,242,255,0.05)" },
        gallery: { display:"flex", gap:10, overflowX:"auto", marginBottom:20, paddingBottom:5 },
        thumb: { width:105, height:105, borderRadius:12, objectFit:"cover", border:"1px solid #1a1a1c" },
        addImg: { width:105, height:105, borderRadius:12, border:"1px dashed #00f2ff", display:"flex", alignItems:"center", justifyContent:"center", color:"#00f2ff", background:"rgba(0,242,255,0.02)", cursor:"pointer", position:"relative" },
        addImg2: { width:105, height:105, borderRadius:12, border:"1px dashed #ffaa00", display:"flex", alignItems:"center", justifyContent:"center", color:"#ffaa00", background:"rgba(255,170,0,0.02)", cursor:"pointer", position:"relative" },
        delImg: { position:"absolute", top:-5, right:-5, background:"#ff4d4d", color:"#fff", border:"none", borderRadius:"50%", width:22, height:22, cursor:"pointer" },
        row: { display:"flex", gap:12, marginBottom:15 },
        label: { display:"block", fontSize:8, fontWeight:900, color:"#444", marginBottom:6, fontFamily:"Orbitron", letterSpacing:2 },
        input: { width:"100%", padding:"14px", background:"#111", border:"1px solid #1a1a1c", borderRadius:10, color:"#fff", fontSize:14, fontFamily:"Inter" },
        textarea: { width:"100%", padding:"14px", background:"#111", border:"1px solid #1a1a1c", borderRadius:10, color:"#fff", fontSize:13, fontFamily:"Inter", minHeight:"80px", resize:"vertical" },
        hero: { width:"100%", padding:"22px", background:"#000", border:"1px solid #00f2ff", borderRadius:14, color:"#00f2ff", textAlign:"center", fontSize:36, fontWeight:900, fontFamily:"Orbitron" },
        btnDiscard: { flex:1, padding:18, background:"#1a1a1c", color:"#555", borderRadius:12, border:"none", fontWeight:800, fontSize:10, fontFamily:"Orbitron", cursor:"pointer" },
        btnDelete: { padding:18, background:"rgba(255,77,77,0.05)", color:"#ff4d4d", border:"1px solid rgba(255,77,77,0.2)", borderRadius:12, cursor:"pointer" },
        btnSync: { flex:2, padding:18, background:"#00f2ff", color:"#000", borderRadius:12, border:"none", fontWeight:900, fontSize:11, fontFamily:"Orbitron", letterSpacing:1, cursor:"pointer" },
        tiny: { fontFamily:"Orbitron", fontSize:9, color:"#444" },
        variantCard: { border:"1px solid #1a1a1c", borderRadius:14, padding:12, background:"rgba(255,255,255,0.01)", marginBottom:10 },
        variantGrid: { display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginTop:10 }
      };

      return (
        <div style={styles.overlay} onClick={onClose}>
          <div style={styles.modal} onClick={e=>e.stopPropagation()}>
            {/* Assets row + AI camera */}
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
              <label style={styles.label}>PRODUCT ASSETS ({(f.img||[]).length}/5)</label>
              <div style={{ display:"flex", gap:10, alignItems:"center" }}>
                <div style={{ display:"flex", gap:8, alignItems:"center", padding:"6px 10px", border:"1px solid #1a1a1c", borderRadius:12 }}>

            <div style={styles.row}>

            <div style={styles.row}>

              </div>
              <div style={{ flex:1 }}>
                <label style={styles.label}>PRODUCT TYPE</label>

            <div style={{ marginBottom:15 }}>
              <label style={styles.label}>PRODUCT NAME</label>
              <input style={styles.input} value={f.name} onChange={e=>setF({...f, name:e.target.value})} placeholder="Nike Air Max..." />
            </div>

            <div style={{ marginBottom:15 }}>
              <label style={styles.label}>ONLINE LINK (URL)</label>
              <input style={styles.input} value={f.link} onChange={e=>setF({...f, link:e.target.value})} placeholder="https://amazon.com/..." />
              <div style={{ display:"flex", gap:10, marginTop:8 }}>
                <button
                  onClick={()=>{
                    const q = encodeURIComponent(f.name || "product");
                    window.open("https://www.google.com/search?q=" + q, "_blank", "noopener,noreferrer");
                  }}
                  style={{ background:"#111", border:"1px solid #1a1a1c", color:"#00f2ff", padding:"10px 12px", borderRadius:10, fontFamily:"Orbitron", fontSize:9, cursor:"pointer" }}
                  title="Open search for the product name"
                >
                  <i className="fas fa-magnifying-glass" style={{ marginRight:8 }}></i>SEARCH WEB
                </button>

                {!!f.link && (
                  <button
                    onClick={()=>{
                      try { window.open(f.link, "_blank", "noopener,noreferrer"); } catch {}
                    }}
                    style={{ background:"#111", border:"1px solid #1a1a1c", color:"#ffaa00", padding:"10px 12px", borderRadius:10, fontFamily:"Orbitron", fontSize:9, cursor:"pointer" }}
                    title="Open the saved product link"
                  >
                    <i className="fas fa-arrow-up-right-from-square" style={{ marginRight:8 }}></i>OPEN LINK
                  </button>
                )}
              </div>
            </div>

            {/* Gender/Size (single fields kept for non-variants) */}
            <div style={styles.row}>
              <div style={{ flex:1 }}>
                <label style={styles.label}>DEFAULT GENDER</label>
                <select style={styles.input} value={f.gender} onChange={e=>setF({...f, gender:e.target.value})}>
                  {GENDERS.map(g=><option key={g} value={g}>{g}</option>)}
                </select>
              </div>
              <div style={{ flex:1 }}>
                <label style={styles.label}>{f.type==="Footwear" ? "DEFAULT US SIZE" : "DEFAULT SIZE"}</label>
                <select
                  style={styles.input}
                  value={f.type==="Footwear" ? (f.shoeSize||"") : (f.size||"")}
                  onChange={e=>setF({...f, [f.type==="Footwear" ? "shoeSize" : "size"]: e.target.value })}
                >
                  <option value="">Select...</option>
                  {(f.type==="Footwear" ? SHOE_SIZES : APPAREL_SIZES).map(sz=><option key={sz} value={sz}>{sz}</option>)}
                </select>
              </div>
            </div>

            {/* VARIANTS (Apparel/Footwear) */}
            {(f.type==="Apparel" || f.type==="Footwear") ? (
              <div style={{ marginBottom: 18 }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
                  <span style={{ ...styles.label, marginBottom:0 }}>APPAREL / FOOTWEAR VARIANTS</span>
                  <button
                    onClick={()=>{
                      setF(p=>{
                        const v = Array.isArray(p.variants) ? [...p.variants] : [];
                        const multiplier = 1 + (activeMarkup/100);
                        v.push({
                          gender: p.gender || "Unisex",
                          color: "Black",
                          size: p.type==="Footwear" ? "" : (p.size || ""),
                          shoeSize: p.type==="Footwear" ? (p.shoeSize || "") : "",
                          qty: 1,
                          costUSD: 0,
                          sellXCD: 0 * EC_RATE * multiplier
                        });
                        return { ...p, variants: v };
                      });
                    }}
                    style={{ background:"#111", border:"1px dashed #00f2ff", color:"#00f2ff", padding:"10px 12px", borderRadius:10, fontFamily:"Orbitron", fontSize:9, cursor:"pointer" }}
                  >
                    <i className="fas fa-plus" style={{ marginRight:8 }}></i>ADD VARIANT
                  </button>
                </div>

                <div style={{ ...styles.variantCard }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                    <div style={{ fontFamily:"Orbitron", fontSize:9, color:"#00ff88", letterSpacing:2 }}>
                      TOTAL COST: ${variantTotals.totalCostUSD.toFixed(2)} USD
                    </div>
                    <div style={{ fontFamily:"Orbitron", fontSize:9, color:"#00f2ff", letterSpacing:2 }}>
                      TOTAL QTY: {variantTotals.totalQty}
                    </div>
                  </div>
                  <div style={{ marginTop:6, fontFamily:"Orbitron", fontSize:9, color:"#444", letterSpacing:2 }}>
                    TOTAL SELL: EC${variantTotals.totalSellXCD.toFixed(2)} (AUTO @ {activeMarkup}%)
                  </div>
                </div>

                {(f.variants || []).map((v, idx) => (
                  <div key={idx} style={styles.variantCard}>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                      <div style={{ fontFamily:"Orbitron", fontSize:9, color:"#444", letterSpacing:2 }}>
                        VARIANT {idx+1}
                      </div>
                      <button
                        onClick={()=>{
                          setF(p=>{
                            const vv = [...(p.variants||[])];
                            vv.splice(idx, 1);
                            return { ...p, variants: vv };
                          });
                        }}
                        style={{ background:"transparent", border:"1px solid rgba(255,77,77,0.2)", color:"#ff4d4d", padding:"8px 10px", borderRadius:10, cursor:"pointer" }}
                        title="Remove variant"
                      >
                        <i className="fas fa-trash"></i>
                      </button>
                    </div>

                    <div style={styles.variantGrid}>
                      <div>
                        <label style={styles.label}>GENDER</label>
                        <select style={styles.input} value={v.gender || "Unisex"} onChange={e=>{
                          const val = e.target.value;
                          setF(p=>{
                            const vv = [...(p.variants||[])];
                            vv[idx] = { ...vv[idx], gender: val };
                            return { ...p, variants: vv };
                          });
                        }}>
                          {GENDERS.map(g=><option key={g} value={g}>{g}</option>)}
                        </select>
                      </div>

                      <div>
                        <label style={styles.label}>COLOR</label>
                        <select style={styles.input} value={v.color || "Black"} onChange={e=>{
                          const val = e.target.value;
                          setF(p=>{
                            const vv = [...(p.variants||[])];
                            vv[idx] = { ...vv[idx], color: val };
                            return { ...p, variants: vv };
                          });
                        }}>
                          {COLORS.map(c=><option key={c} value={c}>{c}</option>)}
                        </select>
                      </div>

                      {f.type === "Footwear" ? (
                        <div>
                          <label style={styles.label}>US SIZE</label>
                          <select style={styles.input} value={v.shoeSize || ""} onChange={e=>{
                            const val = e.target.value;
                            setF(p=>{
                              const vv = [...(p.variants||[])];
                              vv[idx] = { ...vv[idx], shoeSize: val };
                              return { ...p, variants: vv };
                            });
                          }}>
                            <option value="">Select...</option>
                            {SHOE_SIZES.map(sz=><option key={sz} value={sz}>{sz}</option>)}
                          </select>
                        </div>
                      ) : (
                        <div>
                          <label style={styles.label}>SIZE</label>
                          <select style={styles.input} value={v.size || ""} onChange={e=>{
                            const val = e.target.value;
                            setF(p=>{
                              const vv = [...(p.variants||[])];
                              vv[idx] = { ...vv[idx], size: val };
                              return { ...p, variants: vv };
                            });
                          }}>
                            <option value="">Select...</option>
                            {APPAREL_SIZES.map(sz=><option key={sz} value={sz}>{sz}</option>)}
                          </select>
                        </div>
                      )}

                      <div>
                        <label style={styles.label}>QTY</label>
                        <input
                          type="number"
                          style={styles.input}
                          value={v.qty || 1}
                          onFocus={(e)=>{ e.target.select(); focusCursorStart(e); }}
                          onChange={e=>{
                            const val = clampInt(e.target.value, 1);
                            setF(p=>{
                              const vv = [...(p.variants||[])];
                              vv[idx] = { ...vv[idx], qty: val };
                              return { ...p, variants: vv };
                            });
                          }}
                        />
                      </div>

                      <div>
                        <label style={styles.label}>COST (USD)</label>
                        <input
                          type="number"
                          step="0.01"
                          style={styles.input}
                          value={Number(v.costUSD || 0).toFixed(2)}
                          onFocus={(e)=>{ e.target.select(); focusCursorStart(e); }}
                          onChange={e=> updateVariantCost(idx, e.target.value)}
                        />
                      </div>

                      <div>
                        <label style={styles.label}>SELL (XCD) <span style={{color:"#222"}}>Auto @ {activeMarkup}%</span></label>
                        <input
                          type="number"
                          step="0.01"
                          style={styles.input}
                          value={Number(v.sellXCD || 0).toFixed(2)}
                          onFocus={(e)=>{ e.target.select(); focusCursorStart(e); }}
                          onChange={e=>{
                            const val = money(e.target.value);
                            setF(p=>{
                              const vv = [...(p.variants||[])];
                              vv[idx] = { ...vv[idx], sellXCD: val };
                              return { ...p, variants: vv };
                            });
                          }}
                        />
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            ) : (
              <>
                {/* Non-variant pricing (legacy) */}
                <div style={styles.row}>
                  <div style={{ flex:1 }}>
                    <label style={styles.label}>COST (USD)</label>
                    <input
                      type="number"
                      step="0.01"
                      style={styles.input}
                      value={f.cost}
                      onFocus={(e)=>{ e.target.select(); focusCursorStart(e); }}
                      onChange={e=>updateSingleCost(e.target.value)}
                      onBlur={()=>setF(p=>({ ...p, cost: Number(p.cost||0).toFixed(2) }))}
                    />
                  </div>
                  <div style={{ flex:1 }}>
                    <label style={styles.label}>QUANTITY</label>
                    <input
                      type="number"
                      style={styles.input}
                      value={f.qty}
                      onFocus={(e)=>{ e.target.select(); focusCursorStart(e); }}
                      onChange={e=>setF({...f, qty: clampInt(e.target.value, 1)})}
                    />
                  </div>
                </div>

                <div style={{ marginBottom:25 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", marginBottom:8 }}>
                    <label style={styles.label}>SALE PRICE ({curMode}) <span style={{color:"#222"}}>Auto: {activeMarkup}% Markup</span></label>
                    <div style={{ display:"flex", gap:10 }}>
                      <span onClick={()=>setCurMode("USD")} style={{ fontSize:9, color:curMode==="USD" ? "#00f2ff" : "#444", fontFamily:"Orbitron", cursor:"pointer" }}>USD</span>
                      <span onClick={()=>setCurMode("XCD")} style={{ fontSize:9, color:curMode==="XCD" ? "#00f2ff" : "#444", fontFamily:"Orbitron", cursor:"pointer" }}>XCD</span>
                    </div>
                  </div>
                  <input
                    type="number"
                    step="0.01"
                    style={styles.hero}
                    value={curMode==="USD" ? (money(f.sell)/EC_RATE).toFixed(2) : money(f.sell).toFixed(2)}
                    onFocus={(e)=>{ e.target.select(); focusCursorStart(e); }}
                    onChange={e=>{
                      const v = money(e.target.value);
                      setF(p=>({
                        ...p,
                        sell: curMode==="USD" ? (v * EC_RATE).toFixed(2) : v.toFixed(2)
                      }));
                    }}
                  />
                </div>
              </>
            )}

            {/* Notes */}
            <div style={{ marginBottom:25 }}>
              <label style={styles.label}>PRIVATE HUB NOTES</label>
              <textarea style={styles.textarea} value={f.note} onChange={e=>setF({...f, note:e.target.value})} placeholder="Notes for fulfillment..." />
            </div>

            {/* Actions */}
            <div style={{ display:"flex", gap:12 }}>
              <button onClick={onClose} style={styles.btnDiscard}>DISCARD</button>
              {item.name && <button onClick={()=>onDelete(item)} style={styles.btnDelete}><i className="fas fa-trash-alt"></i></button>}
              <button
                onClick={()=>{
                  // Before save: if variant-capable, sync derived totals into legacy fields too.
                  const next = { ...f };
                  if (next.type==="Apparel" || next.type==="Footwear") {
                    next.qty = variantTotals.totalQty;
                    next.cost = (variantTotals.totalCostUSD / Math.max(variantTotals.totalQty,1)).toFixed(2);  // average (for legacy columns)
                    next.sell = (variantTotals.totalSellXCD / Math.max(variantTotals.totalQty,1)).toFixed(2);   // average (for legacy columns)
                  }
                  onSave(next);
                  onClose();
                }}
                style={styles.btnSync}
              >
                UPLINK HUB
              </button>
            </div>

            <div style={{ marginTop:16, fontFamily:"Orbitron", fontSize:9, color:"#222", letterSpacing:2 }}>
              AI requires a key (stored locally). No key = camera still works (no AI).
            </div>
          </div>
        </div>
      );
    };

    /* ====== App ====== */
    const App = () => {
      const [items, setItems] = useState([]);
      const [tabs, setTabs] = useState(DEFAULT_DELIVERY_TABS);
      const [activeTab, setActiveTab] = useState("ALL");
      const [cur, setCur] = useState("USD");
      const [modal, setModal] = useState(null);
      const [commsOpen, setCommsOpen] = useState(false);
      const [lightbox, setLightbox] = useState(null);
      const [syncing, setSyncing] = useState(false);
      const [lastSync, setLastSync] = useState(null);

      const [markupType, setMarkupType] = useState("50");
      const [customMarkup, setCustomMarkup] = useState("75");

      const [fx, setFx] = useState(null);
      const fxTimer = useRef(null);

      const activeMarkupValue = useMemo(() => {
        return markupType === "Custom" ? money(customMarkup) : money(markupType);
      }, [markupType, customMarkup]);

      const triggerFX = (kind) => {
        if (fxTimer.current) clearTimeout(fxTimer.current);
        const text = kind === "Purchased" ? "PURCHASE CONFIRMED" : "SHIPPING LOCKED";
        setFx({ kind, text });
        fxTimer.current = setTimeout(()=>setFx(null), 1100);
      };

      const loadData = async () => {
        setSyncing(true);
        try {
          const r = await fetch(`${API_URL}?cache=${Date.now()}`);
          const d = await r.json();
          if (Array.isArray(d)) {
            const raw = d.map(x => {
              const img = (x["Image URL"] || "").toString().split(IMG_SEP).filter(Boolean);
              const noteRaw = x["Note"] || "";
              const parsed = parseNoteAndVariants(noteRaw);

              const base = {
                id: `${(x["Product Name"]||"").trim()}-${(x["Category/Tab"]||"").trim()}-${Math.random().toString(16).slice(2)}`,
                name: (x["Product Name"] || "").toString().trim(),
                img,
                cost: money(x["Cost Price USD"] || 0),
                sell: money(x["Selling Price XCD"] || 0),
                qty: clampInt(x["Quantity"] || 1),
                link: (x["Online Link"] || "").toString(),
                note: parsed.noteText || "",
                variants: parsed.variants || [],
                type: (x["Product Type"] || "Misc").toString(),
                gender: (x["Gender"] || "Unisex").toString(),
                tab: (x["Category/Tab"] || "Watchlist").toString().trim(),
                status: (x["Status"] || "Assigned").toString(),
                size: (x["Size"] || "").toString(),
                shoeSize: (x["Shoe Size"] || "").toString()
              };

              // normalize variants (ensure numeric)
              if (Array.isArray(base.variants) && base.variants.length) {
                base.variants = base.variants.map(v=>({
                  gender: v.gender || base.gender || "Unisex",
                  color: v.color || "Black",
                  size: v.size || "",
                  shoeSize: v.shoeSize || "",
                  qty: clampInt(v.qty, 1),
                  costUSD: money(v.costUSD),
                  sellXCD: money(v.sellXCD)
                }));
              }

              return base;
            });

            setItems(raw);
            const sheetTabs = [...new Set(raw.map(i => i.tab))].filter(Boolean);
            setTabs(prev => [...new Set([...DEFAULT_DELIVERY_TABS, ...sheetTabs])]);
            setLastSync(new Date().toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" }));
          }
        } catch (e) {
          console.error("Sync Error", e);
        } finally {
          setSyncing(false);
          const boot = document.getElementById("boot-screen");
          if (boot) boot.style.display = "none";
        }
      };

      useEffect(() => { loadData(); }, []);

      const addCategory = () => {
        const name = prompt("Enter new shipment name:");
        if (name && name.trim()) {
          const clean = name.trim();
          setTabs(prev => [...new Set([...prev, clean])]);
          setActiveTab(clean);
        }
      };

      const performSync = async (payload) => {
        setSyncing(true);
        try {
          const params = new URLSearchParams();
          Object.keys(payload).forEach(key => params.append(key, payload[key]));

          await fetch(API_URL, {
            method: "POST",
            body: params,
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" }
          });

          setTimeout(loadData, 2500);
        } catch (err) {
          console.error(err);
          setSyncing(false);
        }
      };

      const handleSave = async (f) => {
        // Decide create/update (same logic as before, keep it simple)
        const action = items.some(i => i.name === f.name && i.tab === f.tab) ? "update" : "create";

        // Pack variants into Note field for storage
        const packedNote = buildNoteWithVariants(f.note, (f.type==="Apparel" || f.type==="Footwear") ? (f.variants || []) : []);

        // If variants exist, store totals into main columns as:
        // - Quantity: total qty
        // - Cost Price USD: average unit cost
        // - Selling Price XCD: average unit sell (XCD)
        const totals = deriveTotals(f);
        const avgCostUSD = totals.totalQty ? (totals.totalCostUSD / totals.totalQty) : 0;
        const avgSellXCD = totals.totalQty ? (totals.totalSellXCD / totals.totalQty) : 0;

        await performSync({
          "Product Name": f.name,
          "Category/Tab": f.tab,
          "Cost Price USD": avgCostUSD.toFixed(2),
          "Selling Price XCD": avgSellXCD.toFixed(2),
          "Quantity": totals.totalQty,
          "Status": f.status,
          "Product Type": f.type,
          "Gender": f.gender,
          "Size": f.size,
          "Shoe Size": f.shoeSize,
          "Online Link": f.link,
          "Note": packedNote,
          "Image URL": (f.img || []).join(IMG_SEP),
          "_action": action
        });
      };

      const handleDelete = async (item) => {
        if (!confirm(`Permanently delete ${item.name}?`)) return;
        await performSync({
          "Product Name": item.name,
          "Category/Tab": item.tab,
          "_action": "delete"
        });
      };

      /* ====== Filters and Dashboard Totals (tab-aware + currency-aware + variant-aware) ====== */
      const visible = useMemo(() => (
        activeTab === "ALL" ? items : items.filter(i => i.tab === activeTab)
      ), [items, activeTab]);

      const totalsByStatus = useMemo(() => {
        let committedUSD = 0;
        let pendingXCD = 0;

        for (const it of visible) {
          const t = deriveTotals(it);
          const costUSD_total = t.totalCostUSD;
          const sellXCD_total = t.totalSellXCD;

          if (["Purchased","Shipped","Received"].includes(it.status)) committedUSD += costUSD_total;
          if (it.status === "Assigned") pendingXCD += sellXCD_total;
        }
        return { committedUSD, pendingXCD };
      }, [visible]);

      const committedDisplay = cur === "USD" ? totalsByStatus.committedUSD : (totalsByStatus.committedUSD * EC_RATE);
      const pendingDisplay   = cur === "USD" ? (totalsByStatus.pendingXCD / EC_RATE) : totalsByStatus.pendingXCD;

      const filtered = visible;

      /* ====== Styles ====== */
      const styles = {
        app: { width:"100%", maxWidth:"500px", margin:"0 auto", minHeight:"100vh", background:"#0a0a0c", borderLeft:"1px solid #1a1a1c", borderRight:"1px solid #1a1a1c", position:"relative" },
        syncing: { position:"fixed", top:20, left:"50%", transform:"translateX(-50%)", background:"#00f2ff", color:"#000", padding:"10px 20px", borderRadius:40, fontWeight:900, fontSize:10, zIndex:9999, fontFamily:"Orbitron", boxShadow:"0 0 20px rgba(0,242,255,0.4)" },
        header: { padding:"24px 16px", borderBottom:"1px solid #1a1a1c", position:"sticky", top:0, background:"rgba(10,10,12,0.96)", backdropFilter:"blur(12px)", zIndex:100 },
        title: { fontFamily:"Orbitron", fontSize:18, color:"#fff", letterSpacing:3, margin:0, fontWeight:900 },
        dash: { display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, margin:"20px 0" },
        dashBox: { background:"#111", padding:12, borderRadius:12, border:"1px solid #1a1a1c" },
        dashLabel: { fontSize:8, color:"#444", fontFamily:"Orbitron", marginBottom:5, display:"block" },
        dashVal: { fontSize:16, fontFamily:"Orbitron", fontWeight:700 },
        addBtn: { width:"100%", padding:16, background:"#00f2ff", color:"#000", border:"none", borderRadius:12, fontWeight:900, fontFamily:"Orbitron", fontSize:11, cursor:"pointer" },
        tabs: { display:"flex", gap:8, padding:"15px 16px", overflowX:"auto", alignItems:"center" },
        tab: { padding:"10px 18px", borderRadius:8, fontSize:8, fontWeight:700, fontFamily:"Orbitron", whiteSpace:"nowrap", border:"1px solid #1a1a1c", background:"transparent", color:"#444", cursor:"pointer" },
        tabPlus: { width:34, height:34, borderRadius:"50%", border:"1px dashed #222", color:"#333", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, cursor:"pointer" },
        card: { display:"flex", padding:16, margin:"0 16px 12px", background:"rgba(255,255,255,0.01)", borderRadius:16, border:"1px solid #1a1a1c", position:"relative", cursor:"pointer" },
        img: { width:80, height:80, borderRadius:10, overflow:"hidden", position:"relative", background:"#111", cursor:"zoom-in" },
        qtyBadge: { position:"absolute", top:4, left:4, background:"#00f2ff", color:"#000", fontSize:9, fontWeight:900, padding:"2px 6px", borderRadius:5, zIndex:7 },
        photoBadge: { position:"absolute", top:4, right:4, background:"rgba(0,0,0,0.7)", border:"1px solid #00f2ff", color:"#00f2ff", fontSize:8, fontWeight:900, padding:"2px 6px", borderRadius:5, zIndex:7 },
        quickLinks: { display:"flex", gap:10, marginTop:10 }
      };

      /* ====== Browser Link Buttons ====== */
      const LINK_DASHBOARD = "https://vinylpressusa.com/grenada-dashboard-mobile/";
      const LINK_TRIP_HELP = "https://vinylpressusa.com/grenada-trip-helper";

      return (
        <div style={styles.app}>
          {syncing && (
            <div style={styles.syncing}>
              <i className="fas fa-satellite-dish fa-spin" style={{ marginRight: 8 }}></i>
              SYNCING HUB...
            </div>
          )}

          {fx && <StatusFX kind={fx.kind} text={fx.text} />}

          <header style={styles.header}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:15 }}>
              <div style={{ display:"flex", alignItems:"center", gap:12 }}>
                <img
                  src={HUB_LOGO}
                  onClick={()=>setCommsOpen(true)}
                  style={{ width:42, height:42, borderRadius:"50%", border:"1px solid #00f2ff", cursor:"pointer" }}
                />
                <div>
                  <h1 style={styles.title}>G-HUB PRO</h1>
                  <div style={{ display:"flex", alignItems:"center", marginTop:2 }}>
                    <div className="live-indicator"></div>
                    <span style={{ fontSize:8, color:"#444", fontFamily:"Orbitron" }}>
                      {lastSync ? `LAST SYNC: ${lastSync}` : "IDLE"}
                    </span>
                  </div>
                </div>
              </div>

              <div style={{ display:"flex", gap:10 }}>
                <button
                  onClick={()=>setCur(cur==="USD" ? "XCD" : "USD")}
                  style={{ background:"#111", border:"1px solid #222", color:"#fff", padding:"10px 12px", borderRadius:8, fontSize:9, fontFamily:"Orbitron", cursor:"pointer" }}
                >
                  {cur}
                </button>
                <button onClick={loadData} style={{ background:"#111", border:"none", color:"#444", width:38, height:38, borderRadius:8, cursor:"pointer" }}>
                  <i className="fas fa-sync-alt"></i>
                </button>
              </div>
            </div>

            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
              <div className="markup-control">
                <span style={{ fontSize:7, fontFamily:"Orbitron", color:"#444", paddingLeft:4 }}>STRATEGY:</span>
                <select className="markup-select" value={markupType} onChange={e=>setMarkupType(e.target.value)}>
                  <option value="50">50% MARKUP</option>
                  <option value="100">100% MARKUP</option>
                  <option value="150">150% MARKUP</option>
                  <option value="200">200% MARKUP</option>
                  <option value="Custom">CUSTOM %</option>
                </select>
                {markupType === "Custom" && (
                  <input type="number" className="markup-input" value={customMarkup} onChange={e=>setCustomMarkup(e.target.value)} />
                )}
              </div>

              <div style={{ fontSize:7, fontFamily:"Orbitron", color:"#00f2ff", letterSpacing:1 }}>
                MULTIPLIER: {(1 + (activeMarkupValue/100)).toFixed(2)}x
              </div>
            </div>

            {/* Browser Link Buttons */}
            <div style={styles.quickLinks}>
              <button
                onClick={()=>window.open(LINK_DASHBOARD, "_blank", "noopener,noreferrer")}
                style={{ flex:1, background:"#111", border:"1px solid #1a1a1c", color:"#00f2ff", padding:"12px 10px", borderRadius:12, fontFamily:"Orbitron", fontSize:9, cursor:"pointer" }}
                title="Open Grenada Dashboard Mobile"
              >
                <i className="fas fa-chart-line" style={{ marginRight:8 }}></i>DASHBOARD
              </button>
              <button
                onClick={()=>window.open(LINK_TRIP_HELP, "_blank", "noopener,noreferrer")}
                style={{ flex:1, background:"#111", border:"1px solid #1a1a1c", color:"#ffaa00", padding:"12px 10px", borderRadius:12, fontFamily:"Orbitron", fontSize:9, cursor:"pointer" }}
                title="Open Grenada Trip Helper"
              >
                <i className="fas fa-map-location-dot" style={{ marginRight:8 }}></i>TRIP HELPER
              </button>
            </div>

            <div style={styles.dash}>
              <div style={styles.dashBox}>
                <span style={{ ...styles.dashLabel, color:"#00ff88" }}>COMMITTED ({cur})</span>
                <div style={styles.dashVal}>
                  {cur==="USD"
                    ? `$${committedDisplay.toLocaleString(undefined,{minimumFractionDigits:2})}`
                    : `EC$${committedDisplay.toLocaleString(undefined,{minimumFractionDigits:2})}`}
                </div>
              </div>

              <div style={styles.dashBox}>
                <span style={{ ...styles.dashLabel, color:"#00f2ff" }}>PENDING ({cur})</span>
                <div style={styles.dashVal}>
                  {cur==="USD"
                    ? `$${pendingDisplay.toLocaleString(undefined,{minimumFractionDigits:2})}`
                    : `EC$${pendingDisplay.toLocaleString(undefined,{minimumFractionDigits:2})}`}
                </div>
              </div>
            </div>

            <button
              onClick={()=>{
                setModal({
                  name:"",
                  cost:"0.00",
                  sell:"0.00",
                  qty:1,
                  type:"Misc",
                  gender:"Unisex",
                  tab: activeTab==="ALL" ? "Watchlist" : activeTab,
                  status:"Assigned",
                  img:[],
                  size:"",
                  shoeSize:"",
                  link:"",
                  note:"",
                  variants:[]
                });
              }}
              style={styles.addBtn}
            >
              + INITIALIZE PRODUCT
            </button>
          </header>

          <div style={styles.tabs}>
            <button onClick={()=>setActiveTab("ALL")} className={activeTab==="ALL" ? "all-active" : ""} style={styles.tab}>ALL</button>
            {tabs.map(t=>(
              <button key={t} onClick={()=>setActiveTab(t)} className={activeTab===t ? "tab-active" : ""} style={styles.tab}>
                {t.toUpperCase()}
              </button>
            ))}
            <button onClick={addCategory} style={styles.tabPlus}><i className="fas fa-plus"></i></button>
          </div>

          <main style={{ paddingBottom:100 }}>
            {filtered.length===0 && (
              <div style={{ textAlign:"center", padding:60, color:"#222", fontSize:9, fontFamily:"Orbitron" }}>NO RECORDS FOUND</div>
            )}

            {filtered.map(i => {
              const t = deriveTotals(i);
              const unitSellXCD = money(i.sell); // legacy unit display
              const displayPrice = cur==="USD"
                ? `$${(t.totalSellXCD / EC_RATE).toFixed(2)}`
                : `EC$${t.totalSellXCD.toFixed(2)}`;

              const costBubbleText = cur==="USD"
                ? `$${t.totalCostUSD.toFixed(2)}`
                : `EC$${(t.totalCostUSD * EC_RATE).toFixed(2)}`;

              return (
                <div key={i.id} onClick={()=>setModal(i)} style={styles.card}>
                  <div
                    style={styles.img}
                    onClick={(e)=>{
                      if ((i.img||[]).length > 0) {
                        e.stopPropagation();
                        setLightbox({ images:i.img, index:0 });
                      }
                    }}
                  >
                    <img src={(i.img||[])[0] || "https://via.placeholder.com/100?text=NONE"} style={{ width:"100%", height:"100%", objectFit:"cover" }} />
                    <div style={styles.qtyBadge}>{t.totalQty}</div>
                    {(i.img||[]).length>0 && (
                      <div style={styles.photoBadge}><i className="fas fa-camera" style={{ marginRight:3 }}></i>{i.img.length}</div>
                    )}
                    {/* Total Cost Bubble (green) */}
                    <div className="cost-bubble">COST {costBubbleText}</div>
                  </div>

                  <div style={{ flex:1, paddingLeft:18 }}>
                    <div style={{ fontSize:8, color:"#444", fontFamily:"Orbitron", fontWeight:800 }}>
                      {(i.type || "MISC").toUpperCase()} | {(i.tab || "").toUpperCase()}
                    </div>
                    <h3 style={{ fontSize:15, fontWeight:700, margin:"5px 0", color:"#fff" }}>{i.name}</h3>

                    <div style={{ display:"flex", gap:8, marginBottom:10, alignItems:"center", flexWrap:"wrap" }}>
                      {(i.type==="Footwear" ? (i.shoeSize) : (i.size)) && (
                        <span style={{ fontSize:8, color:"#888", background:"#111", padding:"2px 5px", borderRadius:4 }}>
                          {i.type==="Footwear" ? `US ${i.shoeSize}` : i.size}
                        </span>
                      )}

                      {/* Variant hint */}
                      {(Array.isArray(i.variants) && i.variants.length > 0) && (
                        <span style={{ fontSize:8, color:"#00f2ff", background:"rgba(0,242,255,0.05)", border:"1px solid rgba(0,242,255,0.2)", padding:"2px 6px", borderRadius:6, fontFamily:"Orbitron" }}>
                          VARIANTS: {i.variants.length}
                        </span>
                      )}

                      <span
                        style={{
                          fontSize:8,
                          fontFamily:"Orbitron",
                          padding:"2px 6px",
                          borderRadius:6,
                          border:"1px solid #1a1a1c",
                          color: i.status==="Assigned" ? "#00f2ff" : "#444",
                          background: "transparent"
                        }}
                        className={
                          i.status==="Purchased" ? "status-purchased" :
                          i.status==="Assigned"  ? "status-assigned"  :
                          i.status==="Shipped"   ? "status-shipped"   :
                          i.status==="Received"  ? "status-received"  : ""
                        }
                      >
                        {i.status==="Assigned" ? "APPROVAL REQ" : (i.status || "").toUpperCase()}
                      </span>
                    </div>

                    <div style={{ color:"#00f2ff", fontSize:20, fontWeight:900, fontFamily:"Orbitron" }}>
                      {displayPrice}
                    </div>
                  </div>

                  <div style={{ position:"absolute", right:15, top:"50%", transform:"translateY(-50%)", color:"#1a1a1c" }}>
                    <i className="fas fa-chevron-right"></i>
                  </div>
                </div>
              );
            })}
          </main>

          {modal && (
            <Form
              item={modal}
              tabs={tabs}
              activeMarkup={activeMarkupValue}
              onClose={()=>setModal(null)}
              onSave={handleSave}
              onDelete={handleDelete}
              onStatusFX={(kind)=>triggerFX(kind)}
            />
          )}
          {commsOpen && <CommsHub onClose={()=>setCommsOpen(false)} />}
          {lightbox && <GalleryLightbox images={lightbox.images} initialIndex={lightbox.index} onClose={()=>setLightbox(null)} />}
        </div>
      );
    };

    createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
