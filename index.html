<script>
  // === CONFIG: your Apps Script Web App URL ===
  const API = "https://script.google.com/macros/s/AKfycbxPuCzoLqRE-xcUuUDx2VTgZnrhPyucuHTjxNJCwU_jeQOXXrJBG6Wq5vvkEHH-JikP/exec";

  const $ = (sel) => document.querySelector(sel);
  const tblBody = $("#tbl tbody");
  const loadMsg = $("#loadMsg");
  const q = $("#q");
  const statusFilter = $("#statusFilter");
  const countEl = $("#count");
  const frm = $("#frm");
  const formMsg = $("#formMsg");
  const btnReload = $("#btnReload");
  const btnAdd = $("#btnAdd");
  const btnDelete = $("#btnDelete");

  let rows = [];
  let selectedKey = null;

  function setLoad(text, type="") {
    loadMsg.textContent = text;
    loadMsg.className = "status" + (type ? " " + type : "");
  }

  function esc(s){ return String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  function keyOf(r){
    return (String(r["Product Name"]||"").trim()+"||"+String(r["Category/Tab"]||"").trim()).toLowerCase();
  }

  function buildStatusOptions() {
    const set = new Set();
    rows.forEach(r => {
      const s = String(r["Status"]||"").trim();
      if (s) set.add(s);
    });
    const cur = statusFilter.value;
    statusFilter.innerHTML = '<option value="">All Status</option>' +
      [...set].sort().map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
    statusFilter.value = cur;
  }

  function applyFilters(list) {
    const needle = q.value.trim().toLowerCase();
    const st = statusFilter.value.trim();
    return list.filter(r => {
      const name = String(r["Product Name"]||"").toLowerCase();
      const okName = !needle || name.includes(needle);
      const okStatus = !st || String(r["Status"]||"").trim() === st;
      return okName && okStatus;
    });
  }

  function render() {
    const filtered = applyFilters(rows);
    countEl.textContent = `${filtered.length} items`;
    tblBody.innerHTML = filtered.map(r => {
      const k = keyOf(r);
      return `<tr data-k="${esc(k)}">
        <td>${esc(r["Product Name"])}</td>
        <td>${esc(r["Category/Tab"])}</td>
        <td>${esc(r["Quantity"] ?? "")}</td>
        <td>${esc(r["Selling Price XCD"] ?? "")}</td>
        <td>${esc(r["Status"] ?? "")}</td>
      </tr>`;
    }).join("");

    tblBody.querySelectorAll("tr").forEach(tr => {
      tr.addEventListener("click", () => {
        const k = tr.getAttribute("data-k");
        const r = rows.find(x => keyOf(x) === k);
        if (r) loadIntoForm(r);
      });
    });
  }

  function clearForm() {
    frm.reset();
    selectedKey = null;
    formMsg.textContent = "";
  }

  function loadIntoForm(r) {
    selectedKey = keyOf(r);
    for (const el of frm.elements) {
      if (!el.name) continue;
      el.value = r[el.name] ?? "";
    }
    formMsg.textContent = "Loaded.";
  }

  // ========= CROSS-DOMAIN GET (JSONP) =========
  function jsonp(url, timeoutMs = 15000) {
    return new Promise((resolve, reject) => {
      const cb = "__ghub_cb_" + Math.random().toString(36).slice(2);
      const script = document.createElement("script");
      const timer = setTimeout(() => cleanup(new Error("JSONP timeout")), timeoutMs);

      function cleanup(err) {
        clearTimeout(timer);
        try { delete window[cb]; } catch(_) { window[cb] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
        if (err) reject(err);
      }

      window[cb] = (data) => {
        cleanup();
        resolve(data);
      };

      const sep = url.includes("?") ? "&" : "?";
      script.src = url + sep + "callback=" + encodeURIComponent(cb) + "&_ts=" + Date.now();
      script.onerror = () => cleanup(new Error("JSONP load error"));
      document.head.appendChild(script);
    });
  }

  async function apiGet() {
    setLoad("Loading…");
    const data = await jsonp(API);

    // Support both response shapes:
    // A) array
    // B) { ok:true, data:[...] }
    if (data && data.ok === false) throw new Error(data.error || "API error");

    const list = Array.isArray(data)
      ? data
      : (data && Array.isArray(data.data) ? data.data : null);

    if (!list) throw new Error("Unexpected response (expected array or {ok:true,data:[]}).");

    rows = list;
    buildStatusOptions();
    render();
    setLoad("Loaded.", "ok");
  }

  // ========= CROSS-DOMAIN POST (hidden form submit) =========
  function apiPost(params) {
    return new Promise((resolve, reject) => {
      // Cross-origin POST is allowed via form submission,
      // but you cannot read the response back. We treat "submitted" as success
      // and then refresh the table with apiGet().
      const iframe = document.createElement("iframe");
      iframe.name = "hidden_post_target";
      iframe.style.display = "none";

      const form = document.createElement("form");
      form.method = "POST";
      form.action = API;
      form.target = iframe.name;

      Object.keys(params).forEach((k) => {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = k;
        input.value = params[k] ?? "";
        form.appendChild(input);
      });

      // Clean up safely
      let done = false;
      const t = setTimeout(() => {
        if (done) return;
        done = true;
        cleanup();
        // Even if Google doesn't fire onload, the request likely went out.
        resolve({ ok: true, note: "submitted_timeout" });
      }, 8000);

      function cleanup() {
        clearTimeout(t);
        try { form.remove(); } catch(_) {}
        try { iframe.remove(); } catch(_) {}
      }

      iframe.onload = () => {
        if (done) return;
        done = true;
        cleanup();
        resolve({ ok: true, note: "submitted" });
      };

      iframe.onerror = () => {
        if (done) return;
        done = true;
        cleanup();
        reject(new Error("POST failed to submit"));
      };

      document.body.appendChild(iframe);
      document.body.appendChild(form);
      form.submit();
    });
  }

  frm.addEventListener("submit", async (e) => {
    e.preventDefault();
    formMsg.textContent = "Saving…";

    const params = { _action: "update" };
    for (const el of frm.elements) {
      if (!el.name) continue;
      params[el.name] = el.value;
    }

    if (!params["Product Name"] || !params["Category/Tab"]) {
      formMsg.textContent = "Product Name and Category/Tab are required.";
      return;
    }

    try {
      await apiPost(params);
      formMsg.textContent = "Saved. Reloading…";
      await apiGet();

      const k = (String(params["Product Name"]).trim()+"||"+String(params["Category/Tab"]).trim()).toLowerCase();
      const r = rows.find(x => keyOf(x) === k);
      if (r) loadIntoForm(r);

      formMsg.textContent = "Saved.";
    } catch (err) {
      formMsg.textContent = "Save failed: " + err.message;
    }
  });

  btnDelete.addEventListener("click", async () => {
    const name = frm.elements["Product Name"]?.value?.trim();
    const tab = frm.elements["Category/Tab"]?.value?.trim();
    if (!name || !tab) {
      formMsg.textContent = "Product Name and Category/Tab are required to delete.";
      return;
    }
    if (!confirm(`Delete "${name}" (${tab}) from the sheet?`)) return;

    formMsg.textContent = "Deleting…";
    try {
      await apiPost({ _action:"delete", "Product Name": name, "Category/Tab": tab });
      formMsg.textContent = "Deleted. Reloading…";
      clearForm();
      await apiGet();
      formMsg.textContent = "Deleted.";
    } catch (err) {
      formMsg.textContent = "Delete failed: " + err.message;
    }
  });

  btnReload.addEventListener("click", () => apiGet().catch(err => setLoad("Load failed: " + err.message, "error")));
  btnAdd.addEventListener("click", clearForm);
  q.addEventListener("input", render);
  statusFilter.addEventListener("change", render);

  // Boot
  apiGet().catch(err => setLoad("Load failed: " + err.message, "error"));
</script>
