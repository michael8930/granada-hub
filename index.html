<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grenada Hub Pro</title>

  <!-- ===== CORE STYLES ===== -->
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121826;
      --accent: #00e5ff;
      --accent-2: #00ff88;
      --text: #e6edf3;
      --muted: #8b949e;
      --danger: #ff5c5c;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a { color: inherit; text-decoration: none; }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: linear-gradient(180deg, #121826, #0b0f14);
      border-bottom: 1px solid #1f2937;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      font-weight: 800;
      letter-spacing: 1px;
      font-size: 15px;
      cursor: pointer;
    }

    .nav-links {
      display: flex;
      gap: 10px;
    }

    .nav-btn {
      padding: 6px 10px;
      border-radius: 8px;
      background: #1f2937;
      font-size: 12px;
      cursor: pointer;
    }

    .nav-btn:hover { background: #273244; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .currency-toggle {
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .add-btn {
      padding: 8px 14px;
      border-radius: 10px;
      background: var(--accent-2);
      color: #000;
      font-weight: 800;
      cursor: pointer;
    }

    /* ===== CALL MENU ===== */
    .call-menu {
      position: absolute;
      top: 54px;
      left: 18px;
      background: var(--panel);
      border: 1px solid #1f2937;
      border-radius: 10px;
      padding: 10px;
      display: none;
      z-index: 1000;
    }

    .call-menu button {
      display: block;
      width: 100%;
      background: #1f2937;
      color: var(--text);
      border: none;
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .call-menu button:hover {
      background: #273244;
    }

    /* ===== DASHBOARD ===== */
    .dashboard {
      padding: 18px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 14px;
    }

    .stat-title {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 800;
    }

    /* ===== FILTER BAR ===== */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .filters select,
    .filters input {
      background: #0f172a;
      border: 1px solid #1f2937;
      color: var(--text);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
    }

    /* ===== INVENTORY TABLE ===== */
    .table-wrap {
      background: var(--panel);
      border: 1px solid #1f2937;
      border-radius: 14px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #1f2937;
      text-align: left;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 11px;
    }

    tr:hover {
      background: #0f172a;
      cursor: pointer;
    }

    /* ===== MODAL (ADD / EDIT PRODUCT) ===== */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .modal-content {
      background: var(--panel);
      border: 1px solid #1f2937;
      border-radius: 16px;
      width: 100%;
      max-width: 520px;
      padding: 18px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 {
      margin-top: 0;
      font-size: 16px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .modal input,
    .modal select,
    .modal textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid #1f2937;
      color: var(--text);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
    }

    .modal textarea { resize: vertical; }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
    }

    .btn-cancel {
      background: #1f2937;
      color: var(--text);
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
    }

    .btn-save {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 8px 18px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>

<body>

<!-- ===== HEADER ===== -->
<div class="header">
  <div class="header-left">
    <div class="logo" id="logoBtn">GRENADA HUB PRO</div>

    <div class="nav-links">
      <a class="nav-btn" href="https://vinylpressusa.com/grenada-trip-helper" target="_blank">Trip Helper</a>
      <a class="nav-btn" href="https://vinylpressusa.com/grenada-dashboard-mobile" target="_blank">Dashboard Mobile</a>
    </div>
  </div>

  <div class="header-right">
    <div class="currency-toggle" id="currencyToggle">USD</div>
    <div class="add-btn" id="addProductBtn">+ Add Product</div>
  </div>
</div>

<!-- ===== CALL MENU ===== -->
<div class="call-menu" id="callMenu">
  <button onclick="window.location.href='tel:+14845135528'">Call Quencie</button>
  <button onclick="window.location.href='tel:+16107035185'">Call Michael</button>
</div>

<!-- ===== DASHBOARD ===== -->
<div class="dashboard">

  <div class="stats">
    <div class="stat">
      <div class="stat-title">Total Items</div>
      <div class="stat-value" id="statItems">0</div>
    </div>
    <div class="stat">
      <div class="stat-title">Total Cost</div>
      <div class="stat-value" id="statCost">$0</div>
    </div>
    <div class="stat">
      <div class="stat-title">Expected Revenue</div>
      <div class="stat-value" id="statRevenue">$0</div>
    </div>
    <div class="stat">
      <div class="stat-title">Needs Price Approval</div>
      <div class="stat-value" id="statNeedsApproval">0</div>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="filters">
    <select id="shipmentFilter"><option>All Shipments</option></select>
    <select id="categoryFilter"><option>All Categories</option></select>
    <select id="statusFilter"><option>All Status</option></select>
    <input type="search" id="searchInput" placeholder="Search product name…" />
  </div>

  <!-- INVENTORY TABLE -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>Shipment</th>
          <th>Category</th>
          <th>Qty</th>
          <th>Sell</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="inventoryBody">
        <!-- rows injected by JSONP -->
      </tbody>
    </table>
  </div>

</div>

<!-- ===== MODAL ===== -->
<div class="modal" id="productModal">
  <div class="modal-content">
    <h2>Add / Edit Product</h2>

    <div class="form-row">
      <input placeholder="Product Name" />
      <select><option>Select Shipment</option></select>
    </div>

    <div class="form-row">
      <select><option>Category</option></select>
      <select>
        <option>Status</option>
        <option>In Stock</option>
        <option>Sold</option>
        <option>Watchlist</option>
      </select>
    </div>

    <div class="form-row">
      <input placeholder="Cost (USD)" />
      <input placeholder="Selling Price" />
    </div>

    <div class="form-row">
      <input placeholder="Quantity" />
      <select>
        <option>Price Approved?</option>
        <option>No</option>
        <option>Yes</option>
      </select>
    </div>

    <textarea placeholder="Notes"></textarea>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save">Save</button>
    </div>
  </div>
</div>

<!-- ===== BASIC INTERACTION JS (NO DATA YET) ===== -->
<script>
  const logoBtn = document.getElementById('logoBtn');
  const callMenu = document.getElementById('callMenu');
  const addBtn = document.getElementById('addProductBtn');
  const modal = document.getElementById('productModal');

  logoBtn.onclick = () => {
    callMenu.style.display = callMenu.style.display === 'block' ? 'none' : 'block';
  };

  addBtn.onclick = () => {
    modal.style.display = 'flex';
  };

  function closeModal() {
    modal.style.display = 'none';
  }
</script>

</body>
</html>
