<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
<title>G-HUB PRO</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
body{margin:0;background:#0a0a0c;color:#fff;font-family:Inter}
*{box-sizing:border-box}
::-webkit-scrollbar{display:none}
input,select,textarea{background:#111;border:1px solid #1a1a1c;color:#fff;border-radius:10px;padding:12px}
.tab-active{border-color:#00f2ff;color:#00f2ff}
.all-active{border-color:#00ff88;color:#00ff88}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

/* ================= CONFIG ================= */
const API_URL = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec";
const EC_RATE = 2.7169;
const IMG_SEP = "|||";
const DEFAULT_TABS = ["Watchlist"];

/* ================= HELPERS ================= */
const money = n => Number(n||0);
const clamp = n => Math.max(1, parseInt(n||1,10));

async function aiScanServer(dataUrl){
  const base64 = dataUrl.split(",")[1];
  const mimeType = dataUrl.match(/^data:(.*?);base64/)?.[1] || "image/jpeg";

  const p = new URLSearchParams();
  p.append("_action","ai_scan");
  p.append("base64",base64);
  p.append("mimeType",mimeType);

  const r = await fetch(API_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/x-www-form-urlencoded" },
    body:p
  });

  const j = await r.json();
  if(!j.ok) throw new Error(j.error||"AI failed");
  return j;
}

/* ================= APP ================= */
function App(){
  const [items,setItems] = React.useState([]);
  const [tabs,setTabs] = React.useState(DEFAULT_TABS);
  const [active,setActive] = React.useState("ALL");
  const [modal,setModal] = React.useState(null);
  const [syncing,setSyncing] = React.useState(false);

  async function load(){
    setSyncing(true);
    const r = await fetch(API_URL+"?t="+Date.now());
    const d = await r.json();
    if(Array.isArray(d)){
      const mapped = d.map(x=>({
        name:x["Product Name"]||"",
        tab:x["Category/Tab"]||"Watchlist",
        cost:money(x["Cost Price USD"]),
        sell:money(x["Selling Price XCD"]),
        qty:clamp(x["Quantity"]),
        status:x["Status"]||"Assigned",
        img:(x["Image URL"]||"").split(IMG_SEP).filter(Boolean),
        note:x["Note"]||""
      }));
      setItems(mapped);
      setTabs([...new Set([...DEFAULT_TABS,...mapped.map(i=>i.tab)])]);
    }
    setSyncing(false);
  }

  React.useEffect(()=>{ load(); },[]);

  async function save(item){
    setSyncing(true);
    const p = new URLSearchParams();
    Object.entries({
      "Product Name":item.name,
      "Category/Tab":item.tab,
      "Cost Price USD":item.cost,
      "Selling Price XCD":item.sell,
      "Quantity":item.qty,
      "Status":item.status,
      "Image URL":item.img.join(IMG_SEP),
      "_action": items.some(i=>i.name===item.name && i.tab===item.tab) ? "update":"create"
    }).forEach(([k,v])=>p.append(k,v));

    await fetch(API_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/x-www-form-urlencoded" },
      body:p,
      mode:"no-cors"
    });

    setModal(null);
    setTimeout(load,1500);
  }

  const visible = active==="ALL" ? items : items.filter(i=>i.tab===active);

  return (
    <div style={{maxWidth:480,margin:"0 auto"}}>
      {syncing && <div style={{padding:10,color:"#00f2ff",textAlign:"center"}}>SYNCING…</div>}

      <header style={{padding:16,borderBottom:"1px solid #1a1a1c"}}>
        <h1 style={{fontFamily:"Orbitron",margin:0}}>G-HUB PRO</h1>
        <button onClick={()=>setModal({name:"",tab:"Watchlist",cost:0,sell:0,qty:1,status:"Assigned",img:[]})}
          style={{marginTop:12,width:"100%",padding:14,background:"#00f2ff",border:0,fontWeight:800}}>
          + ADD PRODUCT
        </button>
      </header>

      <div style={{display:"flex",gap:8,padding:12,overflowX:"auto"}}>
        <button onClick={()=>setActive("ALL")} className={active==="ALL"?"all-active":""}>ALL</button>
        {tabs.map(t=>(
          <button key={t} onClick={()=>setActive(t)} className={active===t?"tab-active":""}>
            {t.toUpperCase()}
          </button>
        ))}
      </div>

      {visible.map((i,idx)=>(
        <div key={idx} onClick={()=>setModal(i)}
          style={{margin:12,padding:14,border:"1px solid #1a1a1c",borderRadius:14}}>
          <strong>{i.name}</strong>
          <div style={{fontSize:12,color:"#00f2ff"}}>EC${(i.sell*i.qty).toFixed(2)}</div>
        </div>
      ))}

      {modal && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.9)",display:"flex",alignItems:"center",justifyContent:"center"}}>
          <div style={{background:"#0a0a0c",padding:20,borderRadius:20,width:"90%",maxWidth:420}}>
            <input placeholder="Product name" value={modal.name}
              onChange={e=>setModal({...modal,name:e.target.value})} />

            <input type="number" placeholder="Cost USD"
              value={modal.cost}
              onChange={e=>{
                const c = money(e.target.value);
                setModal({...modal,cost:c,sell:(c*EC_RATE*1.5).toFixed(2)});
              }} />

            <input type="number" placeholder="Qty"
              value={modal.qty}
              onChange={e=>setModal({...modal,qty:clamp(e.target.value)})} />

            <div style={{margin:"12px 0"}}>
              <label style={{border:"1px dashed #00f2ff",padding:14,display:"block",textAlign:"center"}}>
                <i className="fas fa-camera"></i> ADD PHOTO
                <input type="file" hidden accept="image/*" capture
                  onChange={async e=>{
                    const f = e.target.files[0];
                    if(!f) return;
                    const r = new FileReader();
                    r.onload = async ()=>{
                      const data = r.result;
                      try{
                        const ai = await aiScanServer(data);
                        setModal(m=>({
                          ...m,
                          name:ai.name||m.name,
                          cost:ai.costUSD||m.cost,
                          sell:ai.costUSD?(ai.costUSD*EC_RATE*1.5).toFixed(2):m.sell,
                          img:[...m.img,data]
                        }));
                      }catch{
                        setModal(m=>({...m,img:[...m.img,data]}));
                      }
                    };
                    r.readAsDataURL(f);
                  }} />
              </label>
            </div>

            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setModal(null)} style={{flex:1}}>Cancel</button>
              <button onClick={()=>save(modal)} style={{flex:2,background:"#00f2ff",border:0,fontWeight:800}}>
                SAVE
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
