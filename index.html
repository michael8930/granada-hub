<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>G-HUB PRO</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- React UMD (stable for GitHub Pages) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#0a0a0c;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial}
    ::-webkit-scrollbar{display:none}
    a{color:inherit}
    .shell{max-width:520px;margin:0 auto;min-height:100vh;border-left:1px solid #1a1a1c;border-right:1px solid #1a1a1c}
    .header{padding:16px;border-bottom:1px solid #1a1a1c;position:sticky;top:0;background:rgba(10,10,12,.95);backdrop-filter:blur(10px);z-index:10}
    .title{font-family:Orbitron;margin:0;letter-spacing:2px;font-size:16px}
    .row{display:flex;justify-content:space-between;align-items:center;gap:10}
    .btn{border-radius:12px;border:1px solid #1a1a1c;background:#111;color:#fff;padding:10px 12px;font-family:Orbitron;font-size:10px;cursor:pointer}
    .btnIcon{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center}
    .btnPrimary{background:#00f2ff;border:none;color:#000;font-weight:900;padding:14px 12px;width:100%}
    .status{margin-top:10;color:#00f2ff;font-family:Orbitron;font-size:10px}
    .error{margin-top:10;color:#ff4d4d;font-family:Inter;font-size:12px;white-space:pre-wrap}
    .tabs{display:flex;gap:8;padding:12px;overflow-x:auto;align-items:center}
    .tab{border-radius:12px;border:1px solid #1a1a1c;background:#111;color:#bbb;padding:10px 12px;font-family:Orbitron;font-size:10px;cursor:pointer;white-space:nowrap}
    .tabActive{border-color:#00f2ff;color:#00f2ff}
    .tabAllActive{border-color:#00ff88;color:#00ff88}
    .tabPlus{width:40px;height:40px;border-radius:12px;border:1px dashed #222;background:#0a0a0c;color:#555;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
    .main{padding-bottom:40}
    .empty{padding:30;text-align:center;color:#444;font-family:Orbitron;font-size:10px}
    .card{margin:0 12px 12px;padding:14px;border:1px solid #1a1a1c;border-radius:14px;background:rgba(255,255,255,.01);cursor:pointer}
    .meta{font-family:Orbitron;font-size:10px;color:#444}
    .name{font-size:15px;font-weight:700;margin-top:6}
    .price{margin-top:8;color:#00f2ff;font-family:Orbitron;font-weight:900}

    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
    .modal{background:#0a0a0c;border:1px solid #1a1a1c;border-radius:18px;width:100%;max-width:460px;padding:16px}
    .field{width:100%;background:#111;border:1px solid #1a1a1c;color:#fff;border-radius:12px;padding:12px;font-family:Inter;font-size:14px;outline:none}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10}
    .label{font-family:Orbitron;font-size:10px;color:#555;letter-spacing:1px;margin:10px 0 6px}
    textarea.field{min-height:90px;resize:vertical}
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    /* ================= CONFIG ================= */
    const API_URL = "https://script.google.com/macros/s/AKfycbxPuCzoLqRE-xcUuUDx2VTgZnrhPyucuHTjxNJCwU_jeQOXXrJBG6Wq5vvkEHH-JikP/exec";
    const IMG_SEP = "|||";
    const DEFAULT_TABS = ["Watchlist"]; // these are "Category/Tab" values, not sheet tabs

    /* ================= HELPERS ================= */
    const money = (n) => {
      const v = Number(n);
      return Number.isFinite(v) ? v : 0;
    };
    const clampQty = (n) => {
      const v = parseInt(n, 10);
      return Number.isFinite(v) && v > 0 ? v : 1;
    };
    const str = (v) => (v == null ? "" : String(v)).trim();

    function App(){
      const [items,setItems] = React.useState([]);
      const [tabs,setTabs] = React.useState(DEFAULT_TABS);
      const [active,setActive] = React.useState("ALL");
      const [modal,setModal] = React.useState(null);
      const [syncing,setSyncing] = React.useState(false);
      const [err,setErr] = React.useState("");

      async function load(){
        setErr("");
        setSyncing(true);
        try{
          const r = await fetch(API_URL + "?t=" + Date.now(), { method:"GET" });
          if(!r.ok) throw new Error("HTTP " + r.status);
          const d = await r.json();

          if(Array.isArray(d)){
            const mapped = d.map(x=>({
              name: str(x["Product Name"]),
              tab: str(x["Category/Tab"]) || "Watchlist",
              cost: money(x["Cost Price USD"]),
              sell: money(x["Selling Price XCD"]),
              qty: clampQty(x["Quantity"]),
              link: str(x["Online Link"]),
              note: str(x["Note"]),
              status: str(x["Status"]) || "Assigned",
              type: str(x["Product Type"]),
              gender: str(x["Gender"]),
              size: str(x["Size"]),
              shoeSize: str(x["Shoe Size"]),
              img: str(x["Image URL"]).split(IMG_SEP).filter(Boolean)
            }));

            setItems(mapped);
            const sheetTabs = [...new Set(mapped.map(i=>i.tab).filter(Boolean))];
            setTabs([...new Set([...DEFAULT_TABS, ...sheetTabs])]);
          } else {
            throw new Error("API did not return an array (check doGet JSON).");
          }
        }catch(e){
          setErr("Load failed: " + (e?.message || String(e)));
        }finally{
          setSyncing(false);
        }
      }

      React.useEffect(()=>{ load(); },[]);

      function addCategory(){
        const name = prompt("Enter new Category/Tab value (e.g., January B, Seasonal):");
        if(!name) return;
        const clean = name.trim();
        if(!clean) return;
        setTabs(prev => [...new Set([...prev, clean])]);
        setActive(clean);
      }

      async function save(item){
        setErr("");
        setSyncing(true);
        try{
          const exists = items.some(i => i.name === item.name && i.tab === item.tab);
          const action = exists ? "update" : "create";

          const payload = {
            "Product Name": str(item.name),
            "Category/Tab": str(item.tab),
            "Cost Price USD": money(item.cost).toFixed(2),
            "Selling Price XCD": money(item.sell).toFixed(2),
            "Quantity": clampQty(item.qty),
            "Online Link": str(item.link),
            "Note": str(item.note),
            "Status": str(item.status) || "Assigned",
            "Product Type": str(item.type),
            "Gender": str(item.gender),
            "Size": str(item.size),
            "Shoe Size": str(item.shoeSize),
            "Image URL": (item.img || []).join(IMG_SEP),
            "_action": action
          };

          const p = new URLSearchParams();
          Object.entries(payload).forEach(([k,v])=>p.append(k,v));

          const r = await fetch(API_URL, {
            method:"POST",
            headers:{ "Content-Type":"application/x-www-form-urlencoded" },
            body:p
          });

          // We expect JSON from the new Apps Script
          const j = await r.json().catch(()=>null);
          if(!j || j.ok !== true) throw new Error(j?.error || "Save failed");

          setModal(null);
          await load();
        }catch(e){
          setErr("Save failed: " + (e?.message || String(e)));
        }finally{
          setSyncing(false);
        }
      }

      async function del(item){
        if(!confirm("Delete " + item.name + " (" + item.tab + ")?")) return;
        setErr("");
        setSyncing(true);
        try{
          const p = new URLSearchParams();
          p.append("_action","delete");
          p.append("Product Name", str(item.name));
          p.append("Category/Tab", str(item.tab));

          const r = await fetch(API_URL, {
            method:"POST",
            headers:{ "Content-Type":"application/x-www-form-urlencoded" },
            body:p
          });

          const j = await r.json().catch(()=>null);
          if(!j || j.ok !== true) throw new Error(j?.error || "Delete failed");

          setModal(null);
          await load();
        }catch(e){
          setErr("Delete failed: " + (e?.message || String(e)));
        }finally{
          setSyncing(false);
        }
      }

      const visible = (active==="ALL") ? items : items.filter(i=>i.tab===active);

      return (
        <div className="shell">
          <div className="header">
            <div className="row">
              <h1 className="title">G-HUB PRO</h1>
              <button className="btn btnIcon" onClick={load} title="Refresh">
                <i className="fas fa-rotate"></i>
              </button>
            </div>

            {syncing && <div className="status">SYNCING…</div>}
            {err && <div className="error">{err}</div>}

            <button
              className="btn btnPrimary"
              onClick={()=>{
                setModal({
                  name:"",
                  tab: active==="ALL" ? "Watchlist" : active,
                  cost:0,
                  sell:0,
                  qty:1,
                  link:"",
                  note:"",
                  status:"Assigned",
                  type:"",
                  gender:"",
                  size:"",
                  shoeSize:"",
                  img:[]
                });
              }}
              style={{marginTop:12}}
            >
              + ADD PRODUCT
            </button>
          </div>

          <div className="tabs">
            <button className={"tab " + (active==="ALL" ? "tabAllActive" : "")} onClick={()=>setActive("ALL")}>ALL</button>
            {tabs.map(t=>(
              <button key={t} className={"tab " + (active===t ? "tabActive" : "")} onClick={()=>setActive(t)}>
                {t.toUpperCase()}
              </button>
            ))}
            <button className="tabPlus" onClick={addCategory} title="Add Category/Tab">
              <i className="fas fa-plus"></i>
            </button>
          </div>

          <div className="main">
            {visible.length===0 && <div className="empty">NO RECORDS</div>}

            {visible.map((i,idx)=>(
              <div className="card" key={idx} onClick={()=>setModal({...i})}>
                <div className="meta">{(i.tab||"").toUpperCase()} • {(i.status||"").toUpperCase()}</div>
                <div className="name">{i.name || "(No name)"}</div>
                <div className="price">EC${(money(i.sell) * clampQty(i.qty)).toFixed(2)}</div>
              </div>
            ))}
          </div>

          {modal && (
            <div className="overlay" onClick={()=>setModal(null)}>
              <div className="modal" onClick={(e)=>e.stopPropagation()}>
                <div className="row" style={{marginBottom:10}}>
                  <div style={{fontFamily:"Orbitron",fontSize:11,color:"#00f2ff"}}>EDIT ITEM</div>
                  <button className="btn btnIcon" onClick={()=>setModal(null)} title="Close">
                    <i className="fas fa-xmark"></i>
                  </button>
                </div>

                <div className="label">PRODUCT NAME</div>
                <input className="field" value={modal.name} placeholder="Product Name"
                  onChange={e=>setModal({...modal,name:e.target.value})} />

                <div className="label">CATEGORY/TAB (this is NOT a sheet tab)</div>
                <input className="field" value={modal.tab} placeholder="January A / Seasonal / Watchlist"
                  onChange={e=>setModal({...modal,tab:e.target.value})} />

                <div className="grid2" style={{marginTop:10}}>
                  <div>
                    <div className="label">COST PRICE USD</div>
                    <input className="field" type="number" step="0.01" value={modal.cost}
                      onChange={e=>setModal({...modal,cost:money(e.target.value)})} />
                  </div>
                  <div>
                    <div className="label">SELLING PRICE XCD</div>
                    <input className="field" type="number" step="0.01" value={modal.sell}
                      onChange={e=>setModal({...modal,sell:money(e.target.value)})} />
                  </div>
                </div>

                <div className="grid2" style={{marginTop:10}}>
                  <div>
                    <div className="label">QUANTITY</div>
                    <input className="field" type="number" value={modal.qty}
                      onChange={e=>setModal({...modal,qty:clampQty(e.target.value)})} />
                  </div>
                  <div>
                    <div className="label">STATUS</div>
                    <select className="field" value={modal.status}
                      onChange={e=>setModal({...modal,status:e.target.value})}>
                      <option value="Assigned">Assigned</option>
                      <option value="Purchased">Purchased</option>
                      <option value="Shipped">Shipped</option>
                      <option value="Received">Received</option>
                    </select>
                  </div>
                </div>

                <div className="grid2" style={{marginTop:10}}>
                  <div>
                    <div className="label">ONLINE LINK</div>
                    <input className="field" value={modal.link} placeholder="https://..."
                      onChange={e=>setModal({...modal,link:e.target.value})} />
                  </div>
                  <div>
                    <div className="label">PRODUCT TYPE</div>
                    <input className="field" value={modal.type} placeholder="Electronics / Apparel / etc"
                      onChange={e=>setModal({...modal,type:e.target.value})} />
                  </div>
                </div>

                <div className="grid2" style={{marginTop:10}}>
                  <div>
                    <div className="label">GENDER</div>
                    <input className="field" value={modal.gender} placeholder="Men's / Women's / Unisex"
                      onChange={e=>setModal({...modal,gender:e.target.value})} />
                  </div>
                  <div>
                    <div className="label">SIZE / SHOE SIZE</div>
                    <input className="field" value={(modal.size || modal.shoeSize || "")} placeholder="M / 10.5 / etc"
                      onChange={e=>setModal({...modal,size:e.target.value,shoeSize:""})} />
                  </div>
                </div>

                <div className="label">NOTE</div>
                <textarea className="field" value={modal.note} placeholder="Notes..."
                  onChange={e=>setModal({...modal,note:e.target.value})}></textarea>

                <div style={{display:"flex",gap:10,marginTop:12}}>
                  {modal.name && (
                    <button className="btn" style={{flex:1,borderColor:"rgba(255,77,77,.35)",color:"#ff4d4d"}} onClick={()=>del(modal)}>
                      DELETE
                    </button>
                  )}
                  <button className="btn" style={{flex:2,background:"#00f2ff",border:"none",color:"#000",fontWeight:900}} onClick={()=>save(modal)}>
                    SAVE
                  </button>
                </div>

                <div style={{marginTop:10,fontSize:11,color:"#444"}}>
                  If you see “Load failed”: open the Web App URL directly and confirm it shows JSON.
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
